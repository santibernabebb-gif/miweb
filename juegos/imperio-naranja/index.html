<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Imperio Naranja</title>
<meta name="description" content="Juego incremental de naranjas · SantiSystems Games">
<meta name="theme-color" content="#0e2f2c">
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<meta name="robots" content="noindex">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Imperio Naranja">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Distribución: 3 zonas como un escaparate de mercado (árbol · imperio · tienda); en vertical, árbol arriba y pestañas abajo */
:root{
  --bg:#0e2f2c; --bg2:#123a36; --panel:#164540; --panel2:#1d5650; --line:#0a2421; --ink:#fdf7ee; --muted:#a9cbc4;
  --or:#ff8c1a; --or2:#ffb54d; --or3:#e06a00; --leaf:#57c26a; --gold:#ffd447; --bad:#ff6b5e; --good:#7be08a; --sky1:#7cc6f2; --sky2:#d9f0ff;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif; --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:14px; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;color:inherit;font-size:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
.btn{background:linear-gradient(180deg,var(--or2),var(--or));color:#3a1a00;font-family:var(--display);font-weight:800;font-size:16px;padding:9px 16px;border-radius:12px;box-shadow:0 3px 0 var(--or3),0 6px 14px #0006;transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--or3)}
.btn.sec{background:var(--panel2);color:var(--ink);box-shadow:0 3px 0 var(--line)}
.btn.red{background:linear-gradient(180deg,#ff8a7e,#e5483a);color:#fff;box-shadow:0 3px 0 #9d2a20}
.btn[disabled]{filter:grayscale(.7) brightness(.7);cursor:not-allowed}
.btn.small{font-size:13px;padding:6px 11px}

#app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(260px,30%) minmax(0,1fr) minmax(300px,360px);grid-template-rows:minmax(0,1fr);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
/* ---------- zona izquierda: árbol ---------- */
#left{position:relative;display:flex;flex-direction:column;min-height:0;overflow:hidden;background:linear-gradient(180deg,var(--sky1),var(--sky2) 70%);transition:background 2s}
#left.harvest{background:linear-gradient(180deg,#ffb35c,#ffe7b0 70%)}
#left.night{background:linear-gradient(180deg,#14204a,#3b4a8a 75%)}
#left.spooky{background:linear-gradient(180deg,#2a1640,#6a3a7a 75%)}
#left.rebel{background:linear-gradient(180deg,#3a0f12,#8a3a2a 75%)}
#counter{position:relative;z-index:3;text-align:center;padding:12px 10px 6px;background:linear-gradient(180deg,#0008,#0000)}
#brand{display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--display);font-weight:800;font-size:15px;color:#fff;text-shadow:0 2px 4px #0008;cursor:pointer;line-height:1}
#brand small{font-family:var(--body);font-weight:700;font-size:11px;opacity:.8}
#oranges{font-family:var(--display);font-weight:800;font-size:clamp(24px,3.3vw,38px);line-height:1.05;color:#fff;text-shadow:0 3px 0 #b24e00,0 4px 10px #0007;margin-top:6px;word-break:break-word}
#cps{font-weight:800;font-size:15px;color:#fff;text-shadow:0 2px 4px #0009}
#chips{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.chip{background:#0007;color:#fff;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.chip.hot{background:var(--or);color:#3a1a00;animation:pulse 1.2s infinite}
.chip.fest{background:#7a3ad1}
@keyframes pulse{50%{filter:brightness(1.2)}}
#stage{position:relative;flex:1;min-height:0;cursor:pointer;touch-action:none}
#tree{position:absolute;inset:0;width:100%;height:100%;display:block}
#goal{position:relative;z-index:3;margin:0 10px 10px;padding:7px 10px;background:#0009;border-radius:12px;font-size:13px;font-weight:700}
#goal .bar{height:7px;background:#ffffff22;border-radius:9px;margin-top:5px;overflow:hidden}
#goal .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--or),var(--gold));border-radius:9px;transition:width .3s}
#buffs{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:4px;z-index:4;pointer-events:none}
.buff{background:#000a;border:2px solid var(--gold);color:#fff;border-radius:10px;padding:2px 8px;font-size:12px;font-weight:800;white-space:nowrap}
.buff.bad{border-color:var(--bad)}
#combo{position:absolute;right:10px;top:8px;z-index:4;font-family:var(--display);font-weight:800;font-size:18px;color:var(--gold);text-shadow:0 2px 0 #7a3a00;opacity:0;transition:opacity .2s;pointer-events:none}
.fx{position:absolute;z-index:5;pointer-events:none;font-family:var(--display);font-weight:800;font-size:20px;color:#fff;text-shadow:0 2px 0 #b24e00,0 3px 8px #000a;animation:up .9s ease-out forwards;white-space:nowrap;transform:translate(-50%,0)}
.fx.crit{font-size:26px;color:var(--gold)}
@keyframes up{to{transform:translate(-50%,-70px);opacity:0}}
.shake{animation:shake .25s}
@keyframes shake{25%{transform:translate(3px,-2px)}50%{transform:translate(-3px,2px)}75%{transform:translate(2px,1px)}}
/* ---------- zona central: imperio ---------- */
#mid{display:flex;flex-direction:column;min-height:0;background:var(--bg2);border-left:3px solid var(--line);border-right:3px solid var(--line)}
#menu{display:flex;gap:6px;padding:8px;flex-wrap:wrap;background:var(--panel);border-bottom:3px solid var(--line);align-items:center}
#menu .mb{background:var(--panel2);border-radius:10px;padding:6px 11px;font-weight:800;font-size:13px;position:relative;display:flex;gap:5px;align-items:center;box-shadow:0 2px 0 var(--line)}
#menu .mb:hover{filter:brightness(1.15)}
#menu .mb b{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 4px}
#menu .sp{flex:1}
#news{padding:7px 12px;font-size:13.5px;color:var(--muted);border-bottom:2px solid var(--line);min-height:34px;display:flex;align-items:center;gap:6px;font-style:italic}
#news span{transition:opacity .4s}
#rows{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px;overscroll-behavior:contain}
.erow{position:relative;border-radius:12px;min-height:58px;display:flex;align-items:center;overflow:hidden;box-shadow:inset 0 -4px 0 #0003}
.erow .lab{position:absolute;left:8px;top:4px;font-size:11px;font-weight:800;color:#fffd;text-shadow:0 1px 2px #000;z-index:2}
.erow .ppl{display:flex;flex-wrap:nowrap;gap:2px;padding:16px 8px 4px;overflow:hidden;width:100%}
.erow .ppl span{font-size:26px;line-height:1;filter:drop-shadow(0 2px 1px #0005);animation:bob 2.4s ease-in-out infinite}
.erow .ppl span.new{animation:popin .5s}
@keyframes bob{50%{transform:translateY(-2px)}}
@keyframes popin{from{transform:scale(0)}70%{transform:scale(1.3)}}
#emptyRows{margin:auto;text-align:center;color:var(--muted);padding:20px;font-weight:700}
/* ---------- zona derecha: tienda ---------- */
#store{display:flex;flex-direction:column;min-height:0;background:var(--panel)}
#storeHead{padding:10px 12px 6px;font-family:var(--display);font-weight:800;font-size:20px;display:flex;align-items:center;gap:8px}
#storeHead .sp{flex:1}
#storeScroll{flex:1;overflow-y:auto;padding:0 10px 10px;overscroll-behavior:contain}
.sh{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:8px 2px 6px;display:flex;justify-content:space-between;align-items:center}
.sh button{font-size:12px;color:var(--or2);text-transform:none;letter-spacing:0}
#ups{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.up{aspect-ratio:1;border-radius:12px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:24px;position:relative;box-shadow:inset 0 0 0 3px var(--ring,#0000),0 2px 0 var(--line)}
.up.no{opacity:.45}
.up.can{background:#24645c}
.up.sel{outline:3px solid var(--gold)}
#upInfo{display:none;margin-top:8px;background:var(--bg2);border-radius:12px;padding:10px;font-size:14px}
#upInfo.on{display:block}
#upInfo h4{margin:0 0 4px;font-family:var(--display);font-size:16px;color:var(--or2)}
#upInfo .row2{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
.modes{display:flex;gap:4px;margin:6px 0}
.modes button{flex:1;background:var(--bg2);border-radius:9px;padding:5px 0;font-weight:800;font-size:12.5px}
.modes button.on{background:var(--or);color:#3a1a00}
.modes button.sell.on{background:var(--bad);color:#fff}
.bl{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--bg2);border-radius:12px;margin-bottom:6px;padding:7px 10px;box-shadow:0 2px 0 var(--line);position:relative;transition:background .15s}
.bl:hover{background:#215c55}
.bl.no{opacity:.55}
.bl.can{background:#24645c}
.bl .ic{width:44px;height:44px;flex:0 0 44px;border-radius:11px;background:#0003;display:flex;align-items:center;justify-content:center;font-size:28px}
.bl.lock .ic{filter:brightness(0) opacity(.6)}
.bl .mid{flex:1;min-width:0}
.bl .nm,.bl .pr,.vrow .nm,.vrow .ds{display:block}
.bl .nm{font-family:var(--display);font-weight:800;font-size:16.5px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bl .pr{font-weight:800;font-size:14px;color:var(--or2)}
.bl .pr.no{color:var(--bad)}
.bl .ow{font-family:var(--display);font-weight:800;font-size:30px;color:#ffffff38;line-height:1}
/* tooltip */
#tip{position:fixed;z-index:80;max-width:300px;background:#081c1a;border:2px solid var(--or);border-radius:12px;padding:9px 11px;font-size:13.5px;pointer-events:none;display:none;box-shadow:0 8px 20px #000a}
#tip h4{margin:0 0 3px;font-family:var(--display);font-size:16px;color:var(--or2)}
#tip .q{color:var(--muted);font-style:italic;margin-top:4px}
/* pestañas móviles */
#tabs{display:none}
/* hojas (menús) */
#sheet{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:#0009;padding:16px}
#sheet.on{display:flex}
#sheetBox{background:var(--panel);border-radius:18px;width:min(640px,100%);max-height:min(88vh,760px);display:flex;flex-direction:column;box-shadow:0 20px 50px #000c;border:3px solid var(--line)}
#sheetHead{display:flex;align-items:center;padding:12px 14px;border-bottom:3px solid var(--line);font-family:var(--display);font-weight:800;font-size:21px;gap:8px}
#sheetHead .sp{flex:1}
#sheetHead .x{font-size:22px;width:36px;height:36px;border-radius:10px;background:var(--panel2)}
#sheetBody{overflow-y:auto;padding:12px 14px;overscroll-behavior:contain}
.p{margin:6px 0;line-height:1.35}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #ffffff14}
.kv b{color:var(--or2);text-align:right}
.card{background:var(--bg2);border-radius:12px;padding:10px;margin-bottom:8px}
.card .t{font-weight:800;color:var(--muted);font-size:12px}
.card .w{font-family:var(--display);font-weight:800;font-size:17px;margin:2px 0}
.pbar{height:9px;background:#ffffff1a;border-radius:9px;overflow:hidden;margin:6px 0}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--or),var(--gold))}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);gap:8px}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px}
.ach{aspect-ratio:1;border-radius:12px;background:var(--bg2);font-size:24px;display:flex;align-items:center;justify-content:center}
.ach.off{filter:grayscale(1);opacity:.25}
.ach.sel{outline:3px solid var(--gold)}
#achInfo{min-height:54px;background:var(--bg2);border-radius:12px;padding:8px 10px;margin-bottom:10px}
.vrow{display:flex;align-items:center;gap:10px;background:var(--bg2);border-radius:12px;padding:9px 10px;margin-bottom:6px;width:100%;text-align:left}
.vrow.own{opacity:.75}
.vrow.can{background:#24645c}
.vrow .mid{flex:1}
.vrow .nm{font-weight:800}
.vrow .ds{font-size:13px;color:var(--muted)}
.vrow .c{font-weight:800;color:var(--or2);white-space:nowrap}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #ffffff14}
select,input,textarea{font-family:inherit;font-size:15px;background:var(--bg2);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:7px 9px}
textarea{width:100%}
/* modal */
#overlay{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:70;padding:16px}
#overlay.on{display:flex}
#modal{background:var(--panel);border:3px solid var(--line);border-radius:18px;max-width:440px;width:100%;max-height:90vh;overflow:auto;padding:18px;text-align:center;box-shadow:0 20px 50px #000c;animation:mpop .25s}
@keyframes mpop{from{transform:scale(.85);opacity:0}}
#modal h2{font-family:var(--display);font-weight:800;font-size:23px;margin:2px 0 8px;color:var(--or2);text-wrap:balance}
#modal .emo{font-size:58px;line-height:1.1}
#modal .big{font-family:var(--display);font-weight:800;font-size:26px;color:var(--gold);margin:8px 0}
#modal .acts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
/* avisos */
#toasts{position:fixed;z-index:65;top:calc(60px + env(safe-area-inset-top));right:calc(372px + env(safe-area-inset-right));width:300px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:8px;align-items:center;background:#081c1aee;border:2px solid var(--gold);border-radius:12px;padding:7px 9px;font-size:13px;box-shadow:0 6px 16px #0009;animation:tin .25s}
.toast .e{font-size:24px}
.toast .tx{flex:1;min-width:0}
.toast b{display:block;font-family:var(--display);font-size:14px;color:var(--gold)}
.toast .x{font-size:16px;opacity:.7;padding:2px 4px}
@keyframes tin{from{transform:translateX(20px);opacity:0}}
#banner{position:fixed;z-index:66;left:0;right:0;top:22%;text-align:center;pointer-events:none;font-family:var(--display);font-weight:800;font-size:clamp(22px,4vw,40px);color:var(--gold);text-shadow:0 3px 0 #b24e00,0 6px 16px #000;opacity:0}
#banner.on{animation:ban 1.7s forwards}
@keyframes ban{0%{opacity:0;transform:scale(.5)}15%{opacity:1;transform:scale(1.08)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
/* tutorial */
#hint{position:fixed;z-index:57;background:var(--gold);color:#3a1a00;font-weight:800;font-size:14.5px;padding:9px 12px;border-radius:12px;max-width:250px;box-shadow:0 8px 20px #0009;display:none;animation:hb 1s ease-in-out infinite;pointer-events:none}
#hint::after{content:'';position:absolute;width:14px;height:14px;background:var(--gold);transform:rotate(45deg)}
#hint.h-down::after{bottom:-7px;left:var(--ax,50%)}
#hint.h-up::after{top:-7px;left:var(--ax,50%)}
@keyframes hb{50%{transform:translateY(-4px)}}
/* petardo y objetivos de evento */
#petardo{position:fixed;z-index:58;width:62px;height:62px;font-size:44px;display:flex;align-items:center;justify-content:center;animation:pbob .6s ease-in-out infinite alternate;filter:drop-shadow(0 0 10px #ffd447) drop-shadow(0 0 4px #ff8c1a)}
@keyframes pbob{to{transform:translateY(-10px) rotate(10deg)}}
.ev{position:absolute;z-index:6;font-size:40px;line-height:1;transition:transform .1s}
.ev:active{transform:scale(.8)}
/* intro */
#intro{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 40%,#1d5650,#081c1a 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;cursor:pointer}
#intro .ss{font-family:var(--display);font-weight:800;font-size:clamp(22px,5vw,40px);color:#fff;opacity:0;animation:fin .8s .2s forwards}
#intro .ss em{font-style:normal;color:var(--or)}
#intro .pr{font-size:15px;color:var(--muted);letter-spacing:.3em;text-transform:uppercase;opacity:0;animation:fin .8s .9s forwards}
#intro .title{display:none;flex-direction:column;align-items:center;gap:8px}
#intro .title .emo{font-size:clamp(70px,14vw,120px);animation:tpop .7s;filter:drop-shadow(0 8px 16px #0008)}
#intro h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(40px,9vw,80px);line-height:1;color:var(--or);text-shadow:0 5px 0 #8a3a00,0 10px 24px #000a;animation:tpop .7s}
#intro .tap{margin-top:18px;font-weight:800;font-size:16px;animation:blink 1.2s infinite}
@keyframes fin{to{opacity:1}}
@keyframes tpop{from{transform:scale(.3);opacity:0}70%{transform:scale(1.08)}}
@keyframes blink{50%{opacity:.3}}
#fire{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(circle at 50% 60%,#2d6a3a,#081c1a 70%)}
#fire .emo{font-size:110px;animation:grow 2.6s ease-out}
#fire .h{font-family:var(--display);font-weight:800;font-size:clamp(26px,6vw,46px);color:var(--good);text-shadow:0 4px 0 #1d4a24}
@keyframes grow{from{transform:scale(.1) translateY(80px)}60%{transform:scale(1.2)}}
#padhint{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:61;background:#000c;border-radius:10px;padding:5px 10px;font-size:13px;display:none}

/* ---------- móvil en vertical ---------- */
@media (orientation:portrait) and (max-width:900px){
  #app{grid-template-columns:1fr;grid-template-rows:minmax(0,40%) minmax(0,1fr) auto}
  #left{grid-row:1}
  #mid,#store{grid-row:2;border:0;display:none}
  #mid.on,#store.on{display:flex}
  #menu{display:none}
  #tabs{display:flex;grid-row:3;background:var(--panel);border-top:3px solid var(--line)}
  #tabs button{flex:1;padding:8px 0 6px;font-weight:800;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative;color:var(--muted)}
  #tabs button .e{font-size:22px}
  #tabs button.on{color:var(--or2);box-shadow:inset 0 3px 0 var(--or)}
  #tabs button b{position:absolute;top:3px;left:55%;background:var(--bad);color:#fff;border-radius:999px;font-size:10px;min-width:16px;height:16px;line-height:16px;padding:0 4px}
  #counter{padding:8px 8px 2px}
  #oranges{font-size:28px;margin-top:3px}

function fmt(n,frac){
  if(!isFinite(n)) return '∞'; if(n<0) return '-'+fmt(-n,frac);
  if(n<1000){ if(frac&&n<100&&n%1) return dec(n,1); return Math.floor(n).toString(); }
  if(S.opts.numfmt==='sci'||n>=1e45){ var ex=n.toExponential(2); return en()?ex:ex.replace('.',','); }
  if(n<1e6){ return Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,en()?',':'.'); }
  var e=Math.floor(Math.log10(n)/3), v=n/Math.pow(1000,e); var num=dec(v,v<10?2:v<100?1:0);
  if(S.opts.numfmt==='short') return num+' '+SH[e];
  return num+(en()?ENW[e]:ESW[e]);
}

  if(d) return d+tr('hD')+' '+h+tr('hH'); if(h) return h+tr('hH')+' '+m+tr('hM'); if(m) return m+':'+(s<10?'0':'')+s; return s+tr('hS'); }

function deepMerge(base,obj){ for(var k in base){ if(obj[k]===undefined||obj[k]===null) obj[k]=base[k]; else if(typeof base[k]==='object'&&!Array.isArray(base[k])&&typeof obj[k]==='object') deepMerge(base[k],obj[k]); } return obj; }
function migrate(o){ var base=T.newState(); deepMerge(base,o); while(o.owned.length<T.NB) o.owned.push(0); if(!o.fup) o.fup={};

  o.v=SAVE_VER; return o; }
function save(){ if(!S) return; S.lastSave=Date.now(); try{ var j=JSON.stringify(S), prev=localStorage.getItem(SAVE_KEY); if(prev) localStorage.setItem(SAVE_KEY+'.bak',prev); localStorage.setItem(SAVE_KEY,j);}catch(e){} }

function load(){ var raw=null; try{ raw=localStorage.getItem(SAVE_KEY);}catch(e){}

function inRange(d,f){ var m=d.getMonth(), day=d.getDate(), v=m*100+day, a=f.from[0]*100+f.from[1], b=f.to[0]*100+f.to[1]; return a<=b? (v>=a&&v<=b) : (v>=a||v<=b); }

function fupCount(){ var n=0; for(var k in S.fup) n++; return n; }
function calMult(){ var m=1; if(highSeason()) m*=1.1; if(fiesta()) m*=1.1; return m; }

function buffMult(kind){ var m=1, now=Date.now(); for(var i=0;i<S.buffs.length;i++){ var b=S.buffs[i]; if(b.end>now&&b.kind===kind) m*=b.m; } return m; }
function rogueMult(){ return 1-0.05*(S.rogues?S.rogues.length:0); }
function recalc(){ E=T.eff(S); BASECPS=T.baseCPS(S,E)*Math.pow(1.05,fupCount()); dirty=false; }

function upCount(){ var n=0; for(var k in S.ups) n++; return n; }

function availUps(){ var r=[]; for(var i=0;i<T.UP.length;i++){ var u=T.UP[i]; if(T.uUnlocked(S,u)) r.push(u);} var f=fiesta(); if(f&&S.tut>=4&&totalBld()>=10) f.ups.forEach(function(x,k){ var id='f_'+f.id+'_'+k; if(!S.fup[id]) r.push({id:id,kind:'fiesta',f:f,k:k,cost:Math.max(500,BASECPS*[1800,18000,180000][k])}); }); r.sort(function(a,b){return a.cost-b.cost;}); return r; }

// ================= ÁRBOL (canvas vectorial) =================
var cv=$('#tree'), cx=cv.getContext('2d'), CW=0, CH=0, DPR=1;
var parts=[], squash=0, treeOr=[], snow=[], fwk=[], hearts=[], panchoX=0.3, panchoDir=1, panchoTaps=0;
(function(){ for(var i=0;i<20;i++){ var a=Math.random()*Math.PI*2, d=Math.sqrt(Math.random())*0.78; treeOr.push({x:Math.cos(a)*d*1.05,y:Math.sin(a)*d*0.8-0.05,g:1,s:0.8+Math.random()*0.4}); } for(var j=0;j<50;j++) snow.push({x:Math.random(),y:Math.random(),v:0.0006+Math.random()*0.001}); })();
var BLOBS=[[0,-0.42,0.52],[-0.5,-0.12,0.48],[0.5,-0.12,0.48],[-0.28,0.22,0.5],[0.3,0.22,0.5],[0,-0.02,0.62],[-0.62,0.16,0.34],[0.62,0.16,0.34]];
function resize(){ var r=cv.getBoundingClientRect(); DPR=Math.min(2,window.devicePixelRatio||1); CW=Math.max(1,r.width); CH=Math.max(1,r.height); cv.width=CW*DPR; cv.height=CH*DPR; }
window.addEventListener('resize',function(){ resize(); placeHint(); });
function geo(){ var R=Math.min(CW*0.34,CH*0.33); return {R:R,cx:CW/2,cy:CH*0.44,gy:CH*0.93}; }
function drawTree(t){
  var g=geo(), R=g.R; cx.setTransform(DPR,0,0,DPR,0,0); cx.clearRect(0,0,CW,CH);
  var h=new Date().getHours(), night=h>=21||h<7;
  // sol / luna
  cx.save(); cx.fillStyle=night?'#f3f0d0':'#fff3a0'; cx.shadowColor=night?'#f3f0d088':'#ffd44799'; cx.shadowBlur=30; cx.beginPath(); cx.arc(CW*0.15,CH*0.12,Math.max(14,R*0.16),0,7); cx.fill(); cx.restore();
  if(night){ cx.fillStyle='#ffffffaa'; for(var s=0;s<30;s++){ var sx=(s*97%100)/100*CW, sy=(s*53%60)/100*CH*0.6; if((t/400+s)%7>0.5) cx.fillRect(sx,sy,1.6,1.6);} }
  // colinas
  cx.fillStyle=night?'#22305e':'#8fc98a'; cx.beginPath(); cx.moveTo(0,g.gy-R*0.5); for(var x=0;x<=CW;x+=10) cx.lineTo(x,g.gy-R*0.5-Math.sin(x/CW*6)*R*0.12-Math.sin(x/CW*13)*R*0.05); cx.lineTo(CW,CH); cx.lineTo(0,CH); cx.fill();
  cx.fillStyle=night?'#1f4a2a':'#5fb35a'; cx.beginPath(); cx.ellipse(CW/2,g.gy+R*0.2,CW*0.75,R*0.55,0,Math.PI,0); cx.lineTo(CW,CH); cx.lineTo(0,CH); cx.fill();
  // hilera de naranjitos lejanos según huertos
  var small=Math.min(12,S.owned[2]); for(var k=0;k<small;k++){ var px=CW*(0.06+k*0.08)+(k%2?CW*0.5:0)*0, side=k%2?1:-1, xx=CW/2+side*(R*1.15+Math.floor(k/2)*R*0.28), yy=g.gy-R*0.32-Math.floor(k/2)*R*0.02; if(xx<10||xx>CW-10) continue; cx.fillStyle='#6b4a2a'; cx.fillRect(xx-1.5,yy,3,R*0.12); cx.fillStyle='#2f8a3e'; cx.beginPath(); cx.arc(xx,yy,R*0.1,0,7); cx.fill(); cx.fillStyle='#ff8c1a'; cx.beginPath(); cx.arc(xx+R*0.03,yy+R*0.02,R*0.025,0,7); cx.fill(); }
  // tronco
  var sw=Math.sin(t/1600)*0.02, sq=squash;
  cx.save(); cx.translate(g.cx,g.gy);
  var tg=cx.createLinearGradient(-R*0.12,0,R*0.12,0); tg.addColorStop(0,'#5a3418'); tg.addColorStop(0.5,'#8a5a2c'); tg.addColorStop(1,'#4a2810'); cx.fillStyle=tg;
  cx.beginPath(); cx.moveTo(-R*0.16,0); cx.quadraticCurveTo(-R*0.08,-R*0.4,-R*0.1,-(g.gy-g.cy)); cx.lineTo(R*0.1,-(g.gy-g.cy)); cx.quadraticCurveTo(R*0.08,-R*0.4,R*0.16,0); cx.closePath(); cx.fill();
  cx.fillStyle='#00000022'; cx.beginPath(); cx.ellipse(0,R*0.02,R*0.5,R*0.08,0,0,7); cx.fill();
  cx.restore();
  // copa
  cx.save(); cx.translate(g.cx,g.cy); cx.rotate(sw); cx.scale(1+sq*0.07,1-sq*0.06);
  var cols=[S&&T.rebellion(S)?'#2a5a24':'#1f6a2c', '#2e8b3a', '#46a84a', '#7ccf6a'];
  BLOBS.forEach(function(b){ cx.fillStyle=cols[0]; cx.beginPath(); cx.arc(b[0]*R+R*0.04,b[1]*R+R*0.06,b[2]*R,0,7); cx.fill(); });
  BLOBS.forEach(function(b){ var gr=cx.createRadialGradient(b[0]*R-b[2]*R*0.35,b[1]*R-b[2]*R*0.4,b[2]*R*0.1,b[0]*R,b[1]*R,b[2]*R); gr.addColorStop(0,cols[3]); gr.addColorStop(0.45,cols[2]); gr.addColorStop(1,cols[1]); cx.fillStyle=gr; cx.beginPath(); cx.arc(b[0]*R,b[1]*R,b[2]*R*0.94,0,7); cx.fill(); });
  // naranjas
  for(var o=0;o<treeOr.length;o++){ var q=treeOr[o]; if(q.g<1){ q.g=Math.min(1,q.g+0.006); } var r=R*0.085*q.s*q.g; if(r<1) continue; var ox=q.x*R, oy=q.y*R;
    var og=cx.createRadialGradient(ox-r*0.35,oy-r*0.4,r*0.1,ox,oy,r); og.addColorStop(0,'#ffd27a'); og.addColorStop(0.35,'#ff9a2a'); og.addColorStop(1,'#d9600b'); cx.fillStyle=og; cx.beginPath(); cx.arc(ox,oy,r,0,7); cx.fill();
    cx.fillStyle='#3a8a3a'; cx.beginPath(); cx.ellipse(ox+r*0.3,oy-r*0.95,r*0.35,r*0.16,-0.6,0,7); cx.fill(); }
  cx.restore();
  if(squash>0) squash=Math.max(0,squash-0.1);
  // gamberras
  if(S.rogues&&S.rogues.length){ S.rogues.forEach(function(rg,i){ rg.a+=0.004; var p=roguePos(rg,g,t); var rr=R*0.13; cx.save(); cx.translate(p.x,p.y); cx.rotate(Math.sin(t/200+i)*0.2);
      var gg=cx.createRadialGradient(-rr*0.3,-rr*0.3,rr*0.1,0,0,rr); gg.addColorStop(0,rg.hit>0?'#fff':'#ffb066'); gg.addColorStop(1,'#c2410c'); cx.fillStyle=gg; cx.beginPath(); cx.arc(0,0,rr,0,7); cx.fill();
      cx.strokeStyle='#3a1000'; cx.lineWidth=Math.max(1.5,rr*0.12); cx.lineCap='round'; cx.beginPath(); cx.moveTo(-rr*0.55,-rr*0.35); cx.lineTo(-rr*0.15,-rr*0.15); cx.moveTo(rr*0.55,-rr*0.35); cx.lineTo(rr*0.15,-rr*0.15); cx.stroke();
      cx.fillStyle='#3a1000'; cx.beginPath(); cx.arc(-rr*0.3,rr*0.02,rr*0.1,0,7); cx.arc(rr*0.3,rr*0.02,rr*0.1,0,7); cx.fill(); cx.beginPath(); cx.arc(0,rr*0.5,rr*0.25,Math.PI*1.1,Math.PI*1.9); cx.stroke();
      cx.restore(); if(rg.hit>0) rg.hit--; }); }
  // Pancho
  if(S.pancho.lvl>0||S.owned[2]>0){ panchoX+=0.0006*panchoDir; if(panchoX>0.85||panchoX<0.12) panchoDir*=-1; var pz=Math.max(26,R*0.3); cx.save(); cx.translate(CW*panchoX,g.gy-pz*0.15); cx.scale(panchoDir>0?-1:1,1); cx.font=pz+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; cx.textAlign='center'; cx.textBaseline='bottom'; cx.fillText('🐴',0,Math.sin(t/120)*2); cx.restore(); }
  // zumo (sube con los logros)
  var frac=T.achCount(S)/T.ACH.length, jh=CH*0.02+CH*0.16*frac; if(T.achCount(S)>0){ cx.fillStyle='#ff9a2acc'; cx.beginPath(); cx.moveTo(0,CH); for(var x2=0;x2<=CW;x2+=8) cx.lineTo(x2,CH-jh+Math.sin(x2/40+t/600)*3); cx.lineTo(CW,CH); cx.fill(); cx.fillStyle='#ffd27a88'; cx.fillRect(0,CH-jh+3,CW,2); }
  // partículas
  for(var p2=parts.length-1;p2>=0;p2--){ var P=parts[p2]; P.vy+=0.35; P.x+=P.vx; P.y+=P.vy; P.l--; if(P.y>CH-6&&P.vy>0){ P.vy*=-0.35; P.vx*=0.7; P.y=CH-6; }
    cx.globalAlpha=Math.min(1,P.l/20); var pr=P.r; var pg=cx.createRadialGradient(P.x-pr*0.3,P.y-pr*0.3,pr*0.1,P.x,P.y,pr); pg.addColorStop(0,'#ffd27a'); pg.addColorStop(1,'#e66a00'); cx.fillStyle=pg; cx.beginPath(); cx.arc(P.x,P.y,pr,0,7); cx.fill(); cx.globalAlpha=1; if(P.l<=0) parts.splice(p2,1); }
  for(var hh=hearts.length-1;hh>=0;hh--){ var H=hearts[hh]; H.y-=1; H.l--; cx.globalAlpha=H.l/50; cx.font='20px sans-serif'; cx.fillText('💕',H.x,H.y); cx.globalAlpha=1; if(H.l<=0) hearts.splice(hh,1); }
  // nieve / fuegos
  var f=fiesta(); if(f&&f.id==='navidad'){ cx.fillStyle='#fff'; snow.forEach(function(s){ s.y+=s.v; if(s.y>1) s.y=0; cx.beginPath(); cx.arc(s.x*CW+Math.sin(t/900+s.x*20)*6,s.y*CH,2,0,7); cx.fill(); }); }
  if(buffMult('prod')>=3&&Math.random()<0.08) fwk.push({x:Math.random()*CW,y:CH*0.1+Math.random()*CH*0.3,l:30,c:['#ff6b5e','#ffd447','#7be08a','#9cd3ff','#ff8c1a'][Math.random()*5|0]});
  for(var fw=fwk.length-1;fw>=0;fw--){ var F=fwk[fw], rad=(30-F.l)*1.4; cx.fillStyle=F.c; cx.globalAlpha=F.l/30; for(var a=0;a<12;a++){ var an=a/12*Math.PI*2; cx.beginPath(); cx.arc(F.x+Math.cos(an)*rad,F.y+Math.sin(an)*rad,2,0,7); cx.fill(); } cx.globalAlpha=1; if(--F.l<=0) fwk.splice(fw,1); }
}
function roguePos(rg,g,t){ return {x:g.cx+Math.cos(rg.a)*g.R*0.95, y:g.cy+Math.sin(rg.a)*g.R*0.75+Math.sin(t/300+rg.a*3)*3}; }
function spawnParts(n,x,y){ if(!S.opts.particles) n=Math.min(n,1); var R=geo().R; for(var i=0;i<n;i++) parts.push({x:x,y:y,vx:(Math.random()-0.5)*6,vy:-3-Math.random()*5,l:70,r:R*0.06*(0.7+Math.random()*0.5)}); if(parts.length>120) parts.splice(0,parts.length-120); }

// ================= TOCAR EL ÁRBOL =================
var combo=0, lastClickT=0, clickTimes=[];
function stageTap(x,y){
  if(!started) return; audio();
  var g=geo(), t=performance.now();
  // ¿una gamberra?
  if(S.rogues&&S.rogues.length){ for(var i=0;i<S.rogues.length;i++){ var p=roguePos(S.rogues[i],g,t); if(Math.hypot(p.x-x,p.y-y)<g.R*0.2){ hitRogue(i); return; } } }
  // ¿Pancho?
  if((S.pancho.lvl>0||S.owned[2]>0)&&Math.abs(x-CW*panchoX)<g.R*0.25&&y>g.gy-g.R*0.45){ SFX.hee(); hearts.push({x:CW*panchoX,y:g.gy-g.R*0.3,l:50}); if(++panchoTaps>=20) secret('pancho'); return; }
  harvest(x,y);
}
function harvest(x,y){
  if(!started) return; audio(); var g=geo(); if(x===undefined){ x=g.cx+(Math.random()-0.5)*g.R; y=g.cy+(Math.random()-0.5)*g.R*0.6; }
  var now=performance.now(); combo=now-lastClickT<450?combo+1:Math.max(0,combo-3); lastClickT=now; if(combo>S.stats.maxCombo) S.stats.maxCombo=combo;
  clickTimes.push(now); while(clickTimes.length&&now-clickTimes[0]>1000) clickTimes.shift(); if(clickTimes.length>=15) secret('speed');
  var cm=Math.min(3,1+Math.floor(combo/10)*0.1), crit=Math.random()<E.crit;
  var v=T.clickValue(S,BASECPS,E)*cm*(crit?10:1)*buffMult('click')*seasonState().mult;
  earn(v,true); S.stats.clicks++; S.runClicks++; if(crit) S.stats.crits++;
  squash=1; spawnParts(crit?8:2,x,y); treeOr[Math.random()*treeOr.length|0].g=0;
  fx(x,y,'+'+fmt(v,true)+(crit?' '+tr('crit'):''),crit);
  if(crit){ SFX.crit(); shake($('#stage')); vibrate(30); } else SFX.click();
  var cb=$('#combo'); if(combo>=10){ cb.style.opacity=1; cb.textContent=tr('combo')+' x'+dec(cm,1); } else cb.style.opacity=0;
  if(S.tut===0&&S.stats.clicks>=8&&S.oranges>=12){ S.tut=1; showHint(); }
}
function fx(x,y,txt,big){ var d=document.createElement('div'); d.className='fx'+(big?' crit':''); d.textContent=txt; d.style.left=x+'px'; d.style.top=(y-24)+'px'; $('#stage').appendChild(d); setTimeout(function(){d.remove();},900); }
function shake(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
function vibrate(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms);}catch(e){} }
$('#stage').addEventListener('pointerdown',function(e){ if(e.target.closest('.ev')) return; e.preventDefault(); var r=cv.getBoundingClientRect(); stageTap(e.clientX-r.left,e.clientY-r.top); });

// ================= REBELIÓN =================
var rogueT=Date.now()+30000;
function rogueTick(now,dt){
  if(!T.rebellion(S)){ if(S.rogues.length) S.rogues=[]; return; }
  if(!S.seen.reb){ S.seen.reb=1; modal('<div class="emo">😈🍊</div><h2>'+tr('rogueT')+'</h2><p class="p">'+tr('rogueD')+'</p>',[['OK',null]]); }
  if(now>rogueT&&S.rogues.length<8){ rogueT=now+(25+Math.random()*35)*1000; S.rogues.push({a:Math.random()*7,eaten:0,hp:3,hit:0}); }
  var share=fullCPS()*0.05*dt; S.rogues.forEach(function(r){ r.eaten+=share; });
}
function hitRogue(i){ var r=S.rogues[i]; r.hp--; r.hit=6; SFX.squish(); vibrate(20); if(r.hp<=0){ var n=r.eaten*3+10; earn(n); S.rogues.splice(i,1); S.stats.rogues++; var g=geo(); spawnParts(10,g.cx,g.cy); toast('😈',tr('rogueOk',{n:fmt(n)})); } }

// ================= COMPRAS =================
function buyB(b){
  if(sellMode){ if(!S.owned[b]) return false; var n0=buyMode==='max'?S.owned[b]:Math.min(buyMode,S.owned[b]); var got=0; for(var i=0;i<n0;i++){ got+=T.bSell(S,b,E); S.owned[b]--; } S.oranges+=got; dirty=true; recalc(); SFX.sell(); secret('sell'); renderStore(); renderRows(); return true; }
  var n=buyMode==='max'?T.maxAfford(S,b,E):buyMode; if(n<1) n=1;
  var c=T.bCost(S,b,n,E); if(S.oranges<c) return false;
  var wasNew=S.owned[b]===0; S.oranges-=c; S.owned[b]+=n; dirty=true; recalc(); SFX.buy();
  if(wasNew&&b>0){ banner(tr('newBld',{b:nm(b)})); SFX.ach(); }
  if(b===2&&!S.seen.pancho){ S.seen.pancho=1; setTimeout(function(){ modal('<div class="emo">🐴</div><h2>'+tr('pancho')+'</h2><p class="p">'+tr('panchoIntro')+'</p>',[[tr('mPancho'),function(){openSheet('pancho');}],[tr('close'),null,'sec']]); },600); }
  if(S.tut===1&&S.owned[0]>=1){ S.tut=2; showHint(); setTimeout(function(){ if(S.tut===2){ S.tut=3; showHint(); } },6000); }
  checkBroke(); renderStore(); renderRows(); renderMenu(); return true;
}
function buyU(id){
  var u=availUps().filter(function(x){return x.id===id;})[0]; if(!u) return false; var c=upCost(u); if(S.oranges<c) return false;
  S.oranges-=c; if(u.kind==='fiesta'){ S.fup[id]=1; S.stats.fiestas++; } else S.ups[id]=1;
  dirty=true; recalc(); SFX.buy(); checkBroke();
  if(u.kind==='story'){ modal('<div class="emo">🧪</div><h2>'+T.STORY[u.y][en()?1:0]+'</h2><p class="p">'+tr('story'+u.y)+'</p>',[['OK',null]]); }
  if(u.kind==='paz'){ S.rogues=[]; modal('<div class="emo">🕊️</div><h2>'+tr('pazT')+'</h2><p class="p">'+tr('pazD')+'</p>',[['OK',null]]); }
  if(S.tut===3){ S.tut=4; showHint(); }
  selUp=null; renderStore(); return true;
}
function checkBroke(){ if(S.oranges<1&&S.allEarned>1e6) secret('broke'); }

// ================= TIENDA =================
function upInfo(u){ var o={ring:'transparent'};
  if(u.kind==='tier'){ o.icon=T.B[u.b][1]; o.name=T.TIER_NAMES[en()?'en':'es'][u.t]+' · '+nm(u.b); o.desc=tr('upTier',{b:nm(u.b)}); o.q=T.JOKES[en()?'en':'es'][(u.b*8+u.t)%20]; o.ring=['#c47f3a','#cfd8dc','#ffd447','#7be08a','#5fa8ff','#ff6b5e','#c77dff','#ffffff'][u.t]; }
  else if(u.kind==='click'){ o.icon=['🧤','💪','🎹','👍','🙌','🥋','💥','☝️','👔','👆'][u.k]; o.name=T.CLICKUP[u.k][en()?1:0]; o.desc=u.mode==='x2'?tr('upClickX'):tr('upClickP'); }
  else if(u.kind==='global'){ o.icon=['🥪','🌯','📻','👒','🐴','😴','🏺','🎺','🥘','🍫','☕','🍷','🥣','🥼','🏢','🚀','🟧','🏝️','💎','🗼','♾️','💥'][u.g]||'✨'; o.name=T.GLOBAL[u.g][en()?1:0]; o.desc=tr('upGlobal',{p:Math.round((u.mult-1)*100)}); }
  else if(u.kind==='syn'){ o.icon='🔗'; o.name=T.SYN[u.s][en()?3:2]; o.desc=tr('upSyn',{b2:nm(u.bb),a:nm(u.a)}); }
  else if(u.kind==='story'){ o.icon='🧪'; o.name=T.STORY[u.y][en()?1:0]; o.desc=T.STORY[u.y][en()?3:2]; o.ring='#c77dff'; }
  else if(u.kind==='paz'){ o.icon='🕊️'; o.name=tr('pazT'); o.desc=tr('upPaz'); o.ring='#ffffff'; }
  else if(u.kind==='fiesta'){ o.icon=u.f.emo; o.name=u.f.ups[u.k][en()?1:0]; o.desc=tr('fiestaUp'); o.ring='#c77dff'; }
  else { var sp=T.SPECIAL[u.x]; o.icon={petfreq:'🧨',petdur:'🎆',season:'🌞',seasonlen:'📅',encrew:'📒',offline:'📹',crit:'🎯',net:'🕸️',tax:'💼'}[u.eff]||'✨'; o.name=sp[en()?2:1]; o.desc=sp[en()?4:3]; }
  return o; }
function bRevealed(b){ return S.owned[b]>0||b===0||S.runEarned>=T.baseCost[b]*0.6||S.seen['b'+b]; }
function renderStore(){
  var ups=availUps(), h='';
  ups.forEach(function(u){ var i=upInfo(u), ok=S.oranges>=upCost(u); h+='<button class="up '+(ok?'can':'no')+(selUp===u.id?' sel':'')+'" data-nav data-u="'+u.id+'" style="--ring:'+i.ring+'" aria-label="'+i.name.replace(/"/g,'')+'">'+i.icon+'</button>'; });
  $('#ups').innerHTML=h||'<div style="grid-column:1/-1;color:var(--muted);font-size:13px">'+tr('noUps')+'</div>';
  $('#buyAll').style.display=ups.length>1?'':'none';
  renderUpInfo();
  $('#modes').innerHTML='<button data-sell="0" class="'+(!sellMode?'on':'')+'">'+tr('buy')+'</button><button data-sell="1" class="sell '+(sellMode?'on':'')+'">'+tr('sell')+'</button>'+[1,10,100,'max'].map(function(m){return '<button data-mode="'+m+'" class="'+(buyMode==m?'on':'')+'">'+(m==='max'?tr('max'):'×'+m)+'</button>';}).join('');
  var bh='', lockShown=false;
  for(var b=0;b<T.NB;b++){ if(bRevealed(b)){ S.seen['b'+b]=1; bh+='<button class="bl" data-nav data-b="'+b+'"><span class="ic">'+T.B[b][1]+'</span><span class="mid"><span class="nm">'+nm(b)+'</span><span class="pr num" data-pr="'+b+'"></span></span><span class="ow num">'+(S.owned[b]||'')+'</span></button>'; }
    else if(!lockShown){ lockShown=true; bh+='<div class="bl lock no"><span class="ic">'+T.B[b][1]+'</span><span class="mid"><span class="nm">'+tr('locked')+'</span><span class="pr num">🍊 '+fmt(T.bCost(S,b,1,E))+'</span></span></div>'; } }

  var best=null; for(var b=0;b<T.NB;b++){ var c=T.bCost(S,b,1,E); if(c>S.oranges&&(!best||c<best.c)) best={c:c,n:nm(b),e:T.B[b][1]}; if(S.owned[b]===0) break; }
  availUps().slice(0,6).forEach(function(u){ var c=upCost(u); if(c>S.oranges&&(!best||c<best.c)){ var i=upInfo(u); best={c:c,n:i.name,e:i.icon}; } });
  if(best){ $('#goalTxt').textContent=tr('next')+': '+best.e+' '+best.n+(cps>0?' · '+fmtT((best.c-S.oranges)/cps):''); $('#goalBar').style.width=Math.min(100,S.oranges/best.c*100)+'%'; }
  var bh=''; S.buffs=S.buffs.filter(function(b){return b.end>Date.now();}); S.buffs.forEach(function(b){ bh+='<div class="buff'+(b.bad?' bad':'')+'">'+b.label+' · '+fmtT((b.end-Date.now())/1000)+'</div>'; }); if(S.rogues.length) bh+='<div class="buff bad">😈 ×'+S.rogues.length+' -'+(S.rogues.length*5)+'%</div>'; $('#buffs').innerHTML=bh;
  updateStore(); renderMenu();
  if(sheetName==='enc'){ $$('#sheetBody .card').forEach(function(el,i){ var e=S.enc[i]; if(!e) return; el.querySelector('.pbar i').style.width=(encProgress(e)*100)+'%'; }); }
  if(sheetName==='rep'){ var rg=$('#rgain'); if(rg) rg.textContent='+'+fmt(repGain()); }
  if(sheetName==='pancho'){ var fd=$('#feed'); if(fd) fd.disabled=S.oranges<T.panchoCost(S.pancho.lvl); }
}

// ================= INSTALAR / SALIR =================
var deferredPrompt=null, isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent), standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); deferredPrompt=e; renderMenu(true); });
window.addEventListener('appinstalled',function(){ deferredPrompt=null; renderMenu(true); });
function install(){ audio(); if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt.userChoice.then(function(){ deferredPrompt=null; renderMenu(true); }); } else modal('<div class="emo">📲</div><p class="p">'+tr('installIOS')+'</p>',[[tr('close'),null]]); }
function exitGame(){ modal('<div class="emo">👋</div><h2>'+tr('mExit')+'</h2><p class="p">'+tr('exitQ')+'</p>',[[tr('mExit'),function(){ save(); if(window.SSExit)window.SSExit.salir(); },'red'],[tr('close'),null,'sec']]); }

// ================= TECLADO Y MANDO =================
document.addEventListener('keydown',function(e){
  if(!started){ startGame(); return; }
  var tag=e.target.tagName||''; if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT') return;
  if(e.key==='Escape'){ if($('#overlay').classList.contains('on')) closeModal(); else closeSheet(); return; }
  if($('#overlay').classList.contains('on')) return;
  if(e.code==='Space'){ e.preventDefault(); harvest(); }
  else if(/^Digit[0-9]$/.test(e.code)&&!sheetName){ var i=(+e.code.slice(5)+9)%10; if(i<T.NB&&bRevealed(i)) buyB(i); }
  else if(e.key==='p'||e.key==='P') catchPet();
  else if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); navMove(e.key==='ArrowDown'?1:-1); }
});
function navRoot(){ if($('#overlay').classList.contains('on')) return $('#modal'); if(sheetName) return $('#sheetBody'); return $('#store'); }
function navItems(){ return $$('[data-nav]:not([disabled]),[data-mact]',navRoot()); }
function navMove(d){ var it=navItems(); if(!it.length) return; var i=it.indexOf(document.activeElement); i=i<0?0:(i+d+it.length)%it.length; it[i].focus(); it[i].scrollIntoView({block:'nearest'}); }
var padPrev={}, padRep={};
function padTick(){ var gps=navigator.getGamepads?navigator.getGamepads():[], gp=null; for(var i=0;i<gps.length;i++) if(gps[i]){gp=gps[i];break;} if(!gp) return;
  var now=performance.now(), press=function(k){ var b=gp.buttons[k], v=b&&(b.pressed||b.value>0.5), was=padPrev[k]; padPrev[k]=v; if(v&&!was){ padRep[k]=now+400; return true; } if(v&&(k===12||k===13)&&now>padRep[k]){ padRep[k]=now+120; return true; } return false; };
  if(!started){ if(press(0)||press(9)) startGame(); return; }
  var modalOn=$('#overlay').classList.contains('on');
  if(press(0)){ if(modalOn||sheetName){ var a=document.activeElement; if(a&&navRoot().contains(a)&&a.tagName==='BUTTON') a.click(); else navMove(1); } else harvest(); }
  if(press(1)){ if(modalOn) closeModal(); else closeSheet(); }
  if(press(2)&&!modalOn){ var a2=document.activeElement; if(a2&&navRoot().contains(a2)) a2.click(); else navMove(1); }
  if(press(3)){ if(petEl) catchPet(); else if(evActive&&evActive.els.length){ var el=evActive.els.find(function(x){return x.isConnected;}); if(el) el.dispatchEvent(new PointerEvent('pointerdown')); } else if(S.rogues.length) hitRogue(0); }
  if(press(4)||press(14)) cycleArea(-1); if(press(5)||press(15)) cycleArea(1);
  if(press(12)) navMove(-1); if(press(13)) navMove(1);
  if(press(9)) openSheet(window.matchMedia('(orientation:portrait) and (max-width:900px)').matches?'more':'opts'); if(press(7)) harvest(); }
function cycleArea(d){ var a=['store','empire','more']; var i=a.indexOf(mobTab); i=(i+d+3)%3; if(a[i]==='more'){ openSheet('more'); mobTab='more'; renderMenu(true); } else { closeSheet(); setMobTab(a[i]); } }
window.addEventListener('gamepadconnected',function(){ var h=$('#padhint'); h.textContent=tr('padOn'); h.style.display='block'; setTimeout(function(){h.style.display='none';},8000); });

// ================= BUCLE =================
var autoAcc=0, lastAchT=0, lastSaveT=Date.now(), lastHud=0, lastFest=0;
function logic(){ if(!S||!started) return;
  var now=Date.now(), dt=(now-lastTick)/1000; lastTick=now; if(dirty) recalc();
  if(dt>15){ offline(dt); return; } if(dt<0) return;
  S.playTime+=dt; earn(curCPS()*dt);
  if(E.auto){ autoAcc+=E.auto*dt; while(autoAcc>=1){ autoAcc--; earn(T.clickValue(S,BASECPS,E)*buffMult('click'),true); S.stats.clicks++; } }
  rogueTick(now,dt); petTick(now); evTick(now); encTick(now);
  if(now-lastAchT>1000){ lastAchT=now; checkAch(); }
  if(now-lastFest>30000){ lastFest=now; fiestaTick(); }
  if(now-lastSaveT>10000){ lastSaveT=now; save(); }
  if(now-lastHud>200){ lastHud=now; hud(); }
}
function frame(t){ if(started&&!document.hidden) drawTree(t||0); musicTick(); padTick(); requestAnimationFrame(frame); }
function offline(sec){ recalc(); var capped=Math.min(sec,E.offcap*3600), g=BASECPS*E.offline*capped; if(g>0) earn(g); if(sec>3*3600) secret('away');
  if(sec>=60&&g>0){ modal('<div class="emo">😴</div><h2>'+tr('awayTitle')+'</h2><p class="p">'+tr('awayFor',{t:fmtT(sec)})+'</p><div class="big num" id="cntUp">0</div><p class="p" style="color:var(--muted);font-size:13px">'+tr('awayNote',{p:Math.round(E.offline*100),h:E.offcap})+'</p>',[[tr('collect'),function(){ banner('+'+fmt(g)); SFX.box(); }]]); countUp($('#cntUp'),g); } }
function countUp(el,v){ var t0=performance.now(); (function f(){ var k=Math.min(1,(performance.now()-t0)/1400); el.textContent=fmt(v*(1-Math.pow(1-k,3)))+' 🍊'; if(k<1&&el.isConnected) requestAnimationFrame(f); })(); }
function daily(){ var d=new Date(), key=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); if(S.daily.last===key) return; var first=!S.daily.last;
  var y=new Date(Date.now()-86400000), yk=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate(); S.daily.streak=S.daily.last===yk?S.daily.streak+1:1; S.daily.last=key; if(S.daily.streak>=7) secret('streak');
  if(first) return; var n=Math.max(100,BASECPS*600*Math.min(S.daily.streak,7)/3)*E.daily;
  setTimeout(function(){ modal('<div class="emo">🎁</div><h2>'+tr('dailyTitle')+'</h2><p class="p">'+tr('dailyTxt',{n:S.daily.streak})+'</p><div class="big num">+'+fmt(n)+' 🍊</div>',[[tr('collect'),function(){ earn(n); SFX.box(); banner('+'+fmt(n)); }]]); },500); }
document.addEventListener('visibilitychange',function(){ if(document.hidden) save(); });
window.addEventListener('pagehide',save); window.addEventListener('beforeunload',save);

// ================= INICIO =================
function applyLang(){ if(!window.__ssgSync){ window.__ssgSync=1; try{ var _l=localStorage.getItem('ssg.lang'); if(_l==='es'||_l==='en') S.opts.lang=_l; }catch(e){} } try{ localStorage.setItem('ssg.lang',S.opts.lang); }catch(e){} document.documentElement.lang=S.opts.lang; $$('[data-t]').forEach(function(el){ el.textContent=tr(el.getAttribute('data-t')); }); $('#brandName').textContent='🍊 '+tr('gameName'); $('#farmName').textContent=S.farm?' · '+S.farm:''; document.title=tr('gameName'); rowsSig=''; renderAll(); news(); }
function renderAll(){ renderStore(); renderRows(); renderMenu(true); if(sheetName) renderSheet(); }
function startGame(){ if(started) return; audio(); started=true; var it=$('#intro'); it.style.transition='opacity .4s'; it.style.opacity=0; setTimeout(function(){ it.remove(); },400);
  resize(); lastTick=Date.now(); var away=(Date.now()-S.lastSave)/1000; if(hadSave&&away>=60) offline(away); daily(); petT=Date.now()+45000; SFX.ach();
  if(S.tut<4) setTimeout(showHint,600); }
function init(){
  hadSave=load(); recalc(); applyLang(); resize();
  var intro=$('#intro'), stage2=false, toTitle=function(){ if(stage2||!intro.isConnected) return; stage2=true; intro.querySelector('.ss').style.display='none'; intro.querySelector('.pr').style.display='none'; intro.querySelector('.title').style.display='flex'; };
  setTimeout(toTitle,2400);
  intro.addEventListener('click',function(){ audio(); if(!stage2){ toTitle(); return; } startGame(); });
  $('#brand').addEventListener('click',function(){ logoTaps++; if(logoTaps>=5) secret('logo'); });
  setInterval(logic,100); requestAnimationFrame(frame);
  if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
}
var logoTaps=0;
window.IMPERIO_DEBUG={get S(){return S;},T:T,give:function(n){earn(n);},storm:storm,bugs:bugs,client:client,tax:tax,mayor:mayor,pet:spawnPet,box:openBox,offline:offline,newEnc:newEnc,sheet:openSheet,tab:setMobTab,lottery:drawLottery,replant:doReplant,rebel:function(){ for(var y=0;y<5;y++) S.ups['h'+y]=1; S.owned[12]=Math.max(S.owned[12],40); dirty=true; rogueT=0; }};
init();
})();

</script>
<!-- SantiSystems · Salir del juego -->
<div id="ssExit" hidden style="position:fixed;inset:0;z-index:2147483001;background:#0b0718;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#f7efe6;text-align:center">
  <div style="display:flex;align-items:center;gap:12px"><div style="width:48px;height:48px;border-radius:11px;background:linear-gradient(135deg,#ffb13b,#ff6a3d);display:grid;place-items:center;font:800 italic 27px/1 system-ui,sans-serif;color:#1b1030">S</div><div style="font:800 28px/1 system-ui,sans-serif;text-align:left">SantiSystems<small style="display:block;font:700 11px/1.6 system-ui,sans-serif;letter-spacing:.4em;color:#ffb13b">GAMES</small></div></div>
  <div id="ssExitH" style="font:800 italic 32px/1.1 system-ui,sans-serif;text-transform:uppercase"></div>
  <p id="ssExitTxt" style="margin:0;max-width:40ch;font-size:15px;line-height:1.5;color:#b6a6c8"></p>
  <button type="button" id="ssExitClose" style="padding:12px 28px;border:0;border-radius:12px;background:#ffb13b;color:#1b1030;font-weight:800;font-size:16px;cursor:pointer"></button>
  <button type="button" id="ssExitStay" style="padding:8px 14px;border:0;background:none;color:#b6a6c8;font-size:14px;text-decoration:underline;cursor:pointer"></button>
</div>
<script>
(function(){
  var ov=document.getElementById('ssExit'),$=function(i){return document.getElementById(i)};
  var mm=function(q){return window.matchMedia&&matchMedia(q).matches};
  var app=mm('(display-mode: standalone)')||mm('(display-mode: fullscreen)')||navigator.standalone,touch=mm('(pointer:coarse)');
  function en(){var l=null;try{l=localStorage.getItem('ssg.lang')}catch(e){}if(!l)l=(navigator.language||'es').toLowerCase().indexOf('es')===0?'es':'en';return l==='en'}
  function tryClose(){try{if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen()}catch(_){}
    try{window.close()}catch(_){}try{window.open('','_self');window.close()}catch(_){}}
  function textos(){var E=en();
    $('ssExitH').textContent=E?'Game closed':'Juego cerrado';$('ssExitClose').textContent=E?'Close':'Cerrar';$('ssExitStay').textContent=E?'Play again':'Volver a jugar';
    $('ssExitTxt').textContent=E?(app?(touch?'Thanks for playing. To remove it from the screen, open your recent apps and swipe it away.':'Thanks for playing. You can close this window now.'):(touch?'Thanks for playing. You can close this browser tab now.':'Thanks for playing. You can close this tab now (Ctrl+W).'))
      :(app?(touch?'Gracias por jugar. Para quitarlo de la pantalla, abre las apps recientes y deslízalo hacia arriba.':'Gracias por jugar. Ya puedes cerrar esta ventana.'):(touch?'Gracias por jugar. Ya puedes cerrar esta pestaña del navegador.':'Gracias por jugar. Ya puedes cerrar esta pestaña (Ctrl+W).'));}
  // Salir: se intenta cerrar la ventana; si el navegador no deja, el juego se queda cerrado (parado y sin sonido)
  function salir(){if(window.__rebufoSleep)window.__rebufoSleep(true);if(window.__ssDoze)window.__ssDoze();tryClose();
    setTimeout(function(){if(window.closed)return;textos();ov.hidden=false;$('ssExitClose').focus()},250)}
  function volver(){ov.hidden=true;if(window.__ssWake)window.__ssWake();if(window.__rebufoSleep)window.__rebufoSleep(false)}
  window.SSExit={salir:salir};
  var b=$('ssExitBtn');if(b)b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();
    if(window.__rebufoUnsaved&&window.__rebufoUnsaved()&&window.__rebufoAskSave){window.__rebufoAskSave(salir);return}salir()});
  $('ssExitClose').addEventListener('click',function(e){e.stopPropagation();tryClose();setTimeout(function(){if(!window.closed&&!app&&history.length>1)history.back()},250)});
  $('ssExitStay').addEventListener('click',function(e){e.stopPropagation();volver()});
  ['keydown','keyup','pointerdown','touchstart'].forEach(function(t){addEventListener(t,function(e){if(ov.hidden)return;if(e.target&&ov.contains(e.target))return;e.stopPropagation();if(t==='keydown'&&e.key==='Escape')volver()},true)});
})();
</script>
