    noiseBuf=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;

  if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t0+dur);
  g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(vol,t0+.008);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(dest);o.start(t0);o.stop(t0+dur+.02);
}

  const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=fc||1200;const g=AC.createGain();
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);s.connect(f);f.connect(g);g.connect(dest);s.start(t0);s.stop(t0+dur+.02);
}

      if(now.d&&!pv.d)menuNav(1);if(now.u&&!pv.u)menuNav(-1);if(now.a&&!pv.a)menuPress();if(now.b&&!pv.b)menuBack();padPrev[gp.index]=now}
    else padPrev[gp.index]={u:true,d:true,a:true,b:true};
  }

function mkChest(c,r){return{x:c*T+1,y:r*T-12,w:14,h:12,hp:2,open:false,t:0}}
function genLevel(si){
  const S=STAGES[si],rng=mulberry32(4242+si*977),cols=S.len,map=new Uint8Array(cols*ROWS);
  const set=(c,r,v)=>{if(c>=0&&c<cols&&r>=0&&r<ROWS)map[r*cols+c]=v};
  const ground=(c,gh)=>{for(let r=gh;r<ROWS;r++)set(c,r,1)};
  const spawns=[],chests=[],coins=[];
  const foe=()=>S.foes[Math.floor(rng()*S.foes.length)];
  const addFoe=(c,r,type)=>spawns.push({type:type||foe(),x:c*T,y:r*T,used:false});
  const plat=(c,r,w)=>{for(let i=0;i<w;i++)set(c+i,r,2)};
  const coinRow=(c,r,n)=>{for(let i=0;i<n;i++)coins.push({x:(c+i)*T+5,y:r*T+4,w:6,h:6,vx:0,vy:0,v:5,st:true,life:1e9,t:i*7})};
  let c=0,gh=14;for(;c<12;c++)ground(c,gh);
  const end=cols-32;
  while(c<end){
    const r=rng();
    if(r<.26){const w=5+Math.floor(rng()*5);for(let i=0;i<w;i++)ground(c+i,gh);if(rng()<S.dens)addFoe(c+Math.floor(w/2),gh);if(rng()<.3)addFoe(c+w-1,gh);c+=w}
    else if(r<.42){const big=rng()<.4,w=big?4+Math.floor(rng()*2):2+Math.floor(rng()*2);for(let i=0;i<w;i++)set(c+i,ROWS-1,3);
      if(big){plat(c+Math.floor(w/2)-1,gh-3,3);coinRow(c+Math.floor(w/2)-1,gh-5,3)}else coinRow(c,gh-3,w);
      c+=w;for(let i=0;i<3;i++)ground(c+i,gh);c+=3}
    else if(r<.56){gh=clamp(gh+(rng()<.5?-2:2),10,14);const w=4+Math.floor(rng()*4);for(let i=0;i<w;i++)ground(c+i,gh);if(rng()<S.dens*.6)addFoe(c+w-2,gh);c+=w}
    else if(r<.74){const w=9+Math.floor(rng()*4);for(let i=0;i<w;i++)ground(c+i,gh);plat(c+2,gh-3,4);
      if(gh-6>=3){plat(c+6,gh-6,3);if(rng()<.55)chests.push(mkChest(c+7,gh-6));else coinRow(c+6,gh-7,3)}else coinRow(c+2,gh-4,4);
      if(rng()<S.dens)addFoe(c+8,gh);if(S.foes.includes('archer')&&rng()<.5)addFoe(c+3,gh-3,'archer');c+=w}
    else if(r<.86){const w=7;for(let i=0;i<w;i++)ground(c+i,gh);const bh=rng()<.5?1:2;for(let j=1;j<=bh;j++){set(c+3,gh-j,1);set(c+4,gh-j,1)}
      if(rng()<.5)chests.push(mkChest(c+1,gh));else if(rng()<S.dens)addFoe(c+6,gh);c+=w}
    else{const w=8;for(let i=0;i<w;i++)ground(c+i,gh);addFoe(c+4,gh-5,'bat');if(rng()<.5)addFoe(c+6,gh-3,'bat');coinRow(c+2,gh-2,4);c+=w}
  }
  while(c<cols){ground(c,14);c++}
  const ac=cols-30;
  if(S.boss==='griffin'||S.boss==='necro'){plat(ac+5,10,4);plat(ac+21,10,4)}
  return{si,cols,map,spawns,chests,coins,arenaX:ac*T,bossStarted:false};
}

const tA=(cx,cy)=>tileAt(L,cx,cy);

/* ================= PHYSICS ================= */
function moveX(e,dx){
  e.x+=dx;e.hitWall=false;
  const y0=Math.floor(e.y/T),y1=Math.floor((e.y+e.h-.01)/T);
  if(dx>0){const cx=Math.floor((e.x+e.w-.01)/T);for(let cy=y0;cy<=y1;cy++)if(tA(cx,cy)===1){e.x=cx*T-e.w;e.hitWall=true;break}}
  else if(dx<0){const cx=Math.floor(e.x/T);for(let cy=y0;cy<=y1;cy++)if(tA(cx,cy)===1){e.x=(cx+1)*T;e.hitWall=true;break}}
}
function moveY(e,dy){
  e.onGround=false;e.onOneWay=false;const pb=e.y+e.h;e.y+=dy;
  const x0=Math.floor(e.x/T),x1=Math.floor((e.x+e.w-.01)/T);
  if(dy>0){const cy=Math.floor((e.y+e.h-.01)/T);

  }

function startBoss(){

  banner={a:t('bossCome'),b:t('bosses')[L.si],t:150};playSong('boss');

function bossHit(dmg){if(!B||B.dead||B.ghost)return;B.hp-=dmg;B.flash=6;sfx('hit');if(B.hp<=0)killBoss()}
function killBoss(){
  B.dead=true;B.deathT=170;B.hp=0;ES=[];for(const e of EN)e.alive=false;
  playSong('');sfx('win');shake(8,30);
}
function updateBoss(){
  if(!B)return;if(B.flash>0)B.flash--;
  if(B.dead){B.deathT--;if(B.deathT%8===0)burst(B.x+Math.random()*B.w,B.y+Math.random()*B.h,['#fff','#e9b646','#de5a2c'],8,2.5);if(B.deathT%10===0)sfx('boom');
    if(B.deathT===60){dropCoins(B.x+B.w/2,B.y+B.h/2,22);banner={a:t('victory'),b:t('bosses')[L.si],t:150}}
    if(B.deathT<=0){B=null;clearT=170}return}
  BOSSES[B.type].update(B);
  if(!P.dead&&!B.ghost&&overlap(P,{x:B.x+3,y:B.y+3,w:B.w-6,h:B.h-6}))hurtPlayer(B.x+B.w/2);
}

/* ================= UPDATE ================= */
function updatePlay(){
  if(I.pauseP){pauseGame();return}
  updatePlayer();
  // spawn
  for(const s of L.spawns)if(!s.used&&s.x<camX+W+24&&s.x>camX-40&&!L.bossStarted){s.used=true;EN.push(makeEnemy(s.type,s.x,s.y))}
  for(const e of EN)if(e.alive)updateEnemy(e);
  EN=EN.filter(e=>e.alive&&e.x>camX-220&&e.x<camX+W+260);
  // player shots
  for(const s of PS){s.x+=s.vx;s.y+=s.vy;s.t++;s.life--;
    if(!s.ghost&&tA(Math.floor(s.x/T),Math.floor(s.y/T))===1){s.life=0;spark(s.x,s.y,'#bff4ff');continue}
    for(const e of EN){if(!e.alive||s.hit.has(e))continue;if(circRect(s.x,s.y,s.r,e)){hitEnemy(e,s.dmg);if(s.pierce)s.hit.add(e);else{s.life=0;spark(s.x,s.y,'#fff');break}}}
    if(s.life<=0)continue;
    for(const ch of L.chests)if(!ch.open&&!s.hit.has(ch)&&circRect(s.x,s.y,s.r,ch)){hitChest(ch);if(s.pierce)s.hit.add(ch);else s.life=0}
    if(s.life>0&&B&&!B.dead&&!B.ghost&&!s.hit.has(B)&&circRect(s.x,s.y,s.r,B)){bossHit(s.dmg);if(s.pierce)s.hit.add(B);else{s.life=0;spark(s.x,s.y,'#fff')}}
    if(s.cancel)for(const q of ES)if(q.kind!=='bolt'&&q.kind!=='tele'&&q.kind!=='blast'&&Math.hypot(q.x-s.x,q.y-s.y)<q.r+s.r){q.life=0;spark(q.x,q.y,'#fff')}
    if(s.kind==='comet'&&frame%2===0)PA.push({x:s.x,y:s.y,vx:-s.vx*.2,vy:rnd(-.4,.4),life:14,c:'#ffd27a',s:3,g:0});
  }
  PS=PS.filter(s=>s.life>0&&s.x>camX-30&&s.x<camX+W+30);
  updateEshots();
  updateBoss();
  // coins
  for(const c of CO){c.t++;
    if(!c.st){c.vy=Math.min(c.vy+.2,5);moveX(c,c.vx);moveY(c,c.vy);if(c.onGround)c.vx*=.85;c.life--}
    if(G.upg.magnet){const dx=(P.x+6)-(c.x+3),dy=(P.y+11)-(c.y+3),d=Math.hypot(dx,dy);if(d<75&&d>1){c.x+=dx/d*2.6;c.y+=dy/d*2.6;c.st=true}}
    if(!P.dead&&overlap(P,{x:c.x-3,y:c.y-3,w:12,h:12})){c.life=0;G.coins+=c.v;stageCoins+=c.v;sfx('coin')}
  }
  CO=CO.filter(c=>c.life>0&&c.y<ROWS*T+10);
  for(const k of PK){k.t++;k.vy=Math.min(k.vy+.2,4);moveX(k,0);moveY(k,k.vy);k.life--;
    if(!P.dead&&overlap(P,k)){k.life=0;P.hp=Math.min(G.upg.maxhp,P.hp+2);sfx('heart')}}
  PK=PK.filter(k=>k.life>0);
  for(const ch of L.chests)if(ch.t>0)ch.t--;
  updateParticles();
  // camera
  let tx=L.bossStarted?L.arenaX:P.x+6-W*.42+P.face*24;tx=clamp(tx,0,L.cols*T-W);camX+=(tx-camX)*(L.bossStarted?.08:.12);
  if(Math.abs(tx-camX)<.2)camX=tx;
  if(shakeT>0){shakeT--;if(shakeT===0)shakeM=0}
  if(banner&&--banner.t<=0)banner=null;
  if(clearT>0){clearT--;if(clearT===0)stageClear()}
}
function updateEshots(){
  for(const s of ES){s.t++;s.life--;
    if(s.kind==='tele'){if(s.life<=0){s.kind='bolt';s.life=22;s.w=14;sfx('zap');shake(3,8)}continue}
    if(s.kind==='bolt'){if(!P.dead&&overlap(P,{x:s.x-7,y:0,w:14,h:GY}))hurtPlayer(s.x);continue}
    if(s.kind==='blast'){if(!P.dead&&circRect(s.x,s.y,s.r,P))hurtPlayer(s.x);continue}
    if(s.homing&&!P.dead){const dx=(P.x+6)-s.x,dy=(P.y+11)-s.y,d=Math.hypot(dx,dy)||1,sp=Math.hypot(s.vx,s.vy);s.vx+=dx/d*s.homing;s.vy+=dy/d*s.homing;const n=Math.hypot(s.vx,s.vy);s.vx=s.vx/n*sp;s.vy=s.vy/n*sp}
    if(s.kind==='spore')s.vx=Math.sin(s.t*.05+s.ph)*.6;
    if(s.kind==='bomb'&&s.landed){s.fuse--;if(s.fuse<=0){s.kind='blast';s.r=26;s.life=12;sfx('boom');shake(4,8);burst(s.x,s.y,['#ffd27a','#de5a2c','#555'],14,3)}continue}
    s.vy+=s.grav;s.x+=s.vx;s.y+=s.vy;
    const tt=tA(Math.floor(s.x/T),Math.floor((s.y+s.r*.5)/T));
    if(s.kind==='wave'){/* rides the floor */}
    else if(tt===1||(tt===2&&s.vy>0&&s.grav>0)){
      if(s.kind==='bomb'){s.landed=true;s.fuse=38;s.y=Math.floor((s.y+s.r*.5)/T)*T-s.r;s.vx=s.vy=0}
      else{s.life=0;if(s.kind==='rock'||s.kind==='shard'){burst(s.x,s.y,['#9a8a78','#7fe0ff'],5,1.5)}else spark(s.x,s.y,'#fff')}
      continue}
    if(!P.dead&&circRect(s.x,s.y,s.r,{x:P.x+2,y:P.y+2,w:P.w-4,h:P.h-3})){hurtPlayer(s.x);if(s.kind!=='wave')s.life=0}
    if(s.y>ROWS*T+20||s.x<camX-60||s.x>camX+W+60)s.life=0;
  }
  ES=ES.filter(s=>s.life>0);
}
function updateParticles(){for(const q of PA){q.x+=q.vx;q.y+=q.vy;q.vy+=q.g;q.life--}PA=PA.filter(q=>q.life>0);if(PA.length>400)PA.splice(0,PA.length-400)}

function rep(cx,par,spacing,fn){const off=cx*par;const start=Math.floor((off-60)/spacing);for(let i=start;i<start+Math.ceil((W+140)/spacing)+1;i++){const sx=i*spacing-off;fn(sx,i)}}
const hash=i=>{const s=Math.sin(i*127.1)*43758.5453;return s-Math.floor(s)};

let acc=0,last=performance.now();
function loop(now){
  let dt=now-last;last=now;if(dt>100)dt=100;acc+=dt;
  while(acc>=1000/60){stepFrame();acc-=1000/60}
  render();requestAnimationFrame(loop);
}

    try{window.close()}catch(_){}try{window.open('','_self');window.close()}catch(_){}}
  function textos(){var E=en();
    $('ssExitH').textContent=E?'Game closed':'Juego cerrado';$('ssExitClose').textContent=E?'Close':'Cerrar';$('ssExitStay').textContent=E?'Play again':'Volver a jugar';
    $('ssExitTxt').textContent=E?(app?(touch?'Thanks for playing. To remove it from the screen, open your recent apps and swipe it away.':'Thanks for playing. You can close this window now.'):(touch?'Thanks for playing. You can close this browser tab now.':'Thanks for playing. You can close this tab now (Ctrl+W).'))
      :(app?(touch?'Gracias por jugar. Para quitarlo de la pantalla, abre las apps recientes y deslízalo hacia arriba.':'Gracias por jugar. Ya puedes cerrar esta ventana.'):(touch?'Gracias por jugar. Ya puedes cerrar esta pestaña del navegador.':'Gracias por jugar. Ya puedes cerrar esta pestaña (Ctrl+W).'));}
  // Salir: se intenta cerrar la ventana; si el navegador no deja, el juego se queda cerrado (parado y sin sonido)
  function salir(){if(window.__rebufoSleep)window.__rebufoSleep(true);if(window.__ssDoze)window.__ssDoze();tryClose();
    setTimeout(function(){if(window.closed)return;textos();ov.hidden=false;$('ssExitClose').focus()},250)}
  function volver(){ov.hidden=true;if(window.__ssWake)window.__ssWake();if(window.__rebufoSleep)window.__rebufoSleep(false)}
  window.SSExit={salir:salir};
  var b=$('ssExitBtn');if(b)b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();
    if(window.__rebufoUnsaved&&window.__rebufoUnsaved()&&window.__rebufoAskSave){window.__rebufoAskSave(salir);return}salir()});
  $('ssExitClose').addEventListener('click',function(e){e.stopPropagation();tryClose();setTimeout(function(){if(!window.closed&&!app&&history.length>1)history.back()},250)});
  $('ssExitStay').addEventListener('click',function(e){e.stopPropagation();volver()});
  ['keydown','keyup','pointerdown','touchstart'].forEach(function(t){addEventListener(t,function(e){if(ov.hidden)return;if(e.target&&ov.contains(e.target))return;e.stopPropagation();if(t==='keydown'&&e.key==='Escape')volver()},true)});
})();
</script>
