<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#43B0F1">

<title>Lectolandia</title>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;700;800&display=swap">
<style>
/* Layout: sala de juegos de juguete: tarjetas gruesas sobre cielo, una pantalla por juego, letras en tipografía para primeros lectores */
:root{
  --sky:#43B0F1; --sky2:#2B8FD3; --sun:#FFC83D; --tomato:#FF5B3A; --mint:#1FC2A0; --grape:#7B4FE0; --pink:#FF6BA9; --orange:#F2913D;
  --ink:#1D1A3A; --paper:#FFFBEF; --cream:#F3EEDC; --road:#3C3B4E; --white:#FFFFFF;
  --f-ui:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-read:"Andika","Comic Sans MS","Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--sky);background-image:radial-gradient(rgba(255,255,255,.2) 2px,transparent 2.6px);background-size:28px 28px;color:var(--ink);font-family:var(--f-ui);overflow-x:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.wd{font-family:var(--f-read);font-weight:700;letter-spacing:.02em}
body.lower .wd{text-transform:lowercase}
button{font-family:inherit;color:inherit;border:0;cursor:pointer}
button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.screen{display:none;min-height:100%}
.screen.on{display:flex;flex-direction:column}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.btn{background:var(--white);border-radius:18px;box-shadow:0 6px 0 rgba(29,26,58,.28);font-weight:800;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(29,26,58,.28)}
.btn.sm{width:46px;height:46px;border-radius:14px;font-size:22px;flex:none;display:grid;place-items:center}

/* Menú */
#menu{padding-block:14px 30px;gap:18px}
.top{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;align-items:center}
.topsp{flex:1}
@media (max-width:520px){.top .lg{display:none}.top{gap:8px}.chipbtn{padding:0 11px}}
.site{font-size:16px}
body:not(.web) .site{display:none}
.chipbtn{height:44px;padding:0 14px;border-radius:14px;font-size:18px;display:flex;align-items:center;gap:6px}
.logo{margin:4px 0 0;text-align:center;font-size:clamp(44px,13vw,84px);font-weight:800;line-height:1;letter-spacing:-.01em;text-wrap:balance}
.logo span{display:inline-block;color:var(--c);text-shadow:0 5px 0 rgba(29,26,58,.3);-webkit-text-stroke:2px var(--white);animation:bob 2.6s ease-in-out infinite;animation-delay:var(--dl)}
.sub{text-align:center;color:var(--white);font-size:20px;font-weight:700;margin:6px 0 0;text-shadow:0 2px 0 rgba(29,26,58,.25)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;max-width:640px;width:100%;margin:0 auto}
.gcard{background:var(--c);color:var(--white);border-radius:26px;padding:16px 14px 14px;text-align:left;display:flex;flex-direction:column;gap:4px;box-shadow:0 8px 0 rgba(29,26,58,.3);min-height:170px;position:relative;overflow:hidden;transition:transform .08s,box-shadow .08s}
.gcard:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(29,26,58,.3)}
.gcard::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.16)}
.gi{font-size:52px;line-height:1.1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.18))}
.gn{font-size:21px;font-weight:800;line-height:1.1;text-wrap:balance}
.gd{font-size:15px;font-weight:600;opacity:.95;line-height:1.2}
.gs{margin-top:auto;font-size:15px;font-weight:800;background:rgba(29,26,58,.22);align-self:flex-start;padding:2px 10px;border-radius:999px}
.foot{text-align:center}
.foot button{background:transparent;color:var(--white);font-weight:700;font-size:15px;text-decoration:underline;opacity:.9;padding:8px}

/* Cabeceras */
.hdr{display:flex;align-items:center;gap:10px;padding-block:10px 6px}
.hdr h2{margin:0;flex:1;min-width:0;color:var(--white);font-size:20px;font-weight:800;text-shadow:0 2px 0 rgba(29,26,58,.3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:5px;flex:none}
.dots i{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.35);display:grid;place-items:center;font-style:normal;font-size:13px}
.dots i.on{background:var(--sun);box-shadow:0 2px 0 rgba(29,26,58,.3);animation:pop .4s}

/* Niveles */
#lv .lvbox{flex:1;display:flex;flex-direction:column;align-items:center;gap:16px;padding-block:10px 30px}
.lvicon{font-size:90px;line-height:1;animation:bob 2.4s ease-in-out infinite}
.lvlist{display:flex;flex-direction:column;gap:16px;width:100%;max-width:440px}
.lvb{display:flex;align-items:center;gap:14px;padding:14px 18px;text-align:left;background:var(--white);border-radius:22px}
.lvb .n{width:58px;height:58px;border-radius:16px;background:var(--c);color:var(--white);font-size:30px;font-weight:800;display:grid;place-items:center;flex:none}
.lvb .t{flex:1;min-width:0}
.lvb b{display:block;font-size:22px;line-height:1.1}
.lvb small{font-size:15px;font-weight:600;color:#5d5876}
.lvb .st{font-size:22px;color:var(--sun);letter-spacing:2px;-webkit-text-stroke:1px #c9921b}
.lvb.lock{opacity:.6}
.lvb.lock .n{background:#9b97ad}

/* Juego */
#play{height:100%}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding-block:6px 14px;overflow:auto;position:relative}
.stage>*{width:100%;max-width:760px;margin-inline:auto;box-sizing:border-box}
@media (hover:hover){.btn:hover,.gcard:hover{filter:brightness(1.06)}}
.kh{display:none;text-align:center;color:var(--white);font-weight:700;font-size:15px;opacity:.9;margin:0 auto}
@media (hover:hover) and (pointer:fine){.kh{display:block}}
.hint{margin:0 auto;text-align:center;color:var(--white);font-size:19px;font-weight:700;text-shadow:0 2px 0 rgba(29,26,58,.25)}
.panel{background:var(--paper);border-radius:22px;box-shadow:0 6px 0 rgba(29,26,58,.22)}
.pic{font-size:56px;line-height:1}
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.slot{min-width:56px;height:58px;padding:0 6px;border-radius:14px;border:3px dashed #cfc6a6;display:grid;place-items:center;font-size:30px;color:#cdc4a4;background:var(--white)}
.slots.big .slot{min-width:46px;height:56px;font-size:32px}
.slot.ok{border-style:solid;border-color:var(--mint);color:var(--ink);background:#E2FBF4;animation:pop .35s}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tile{width:62px;height:64px;font-size:34px;border-radius:16px}
.tile.used{visibility:hidden}
.shake{animation:shake .4s}
body.kbd .kf{outline:5px solid var(--sun);outline-offset:4px;transform:scale(1.1);z-index:2;position:relative}
body.kbd .house.kf{outline-offset:2px;border-radius:14px}
body.kbd .bub.kf{animation-play-state:paused}

/* Carrera */
.target{display:flex;align-items:center;gap:12px;justify-content:center;padding:8px 12px}
.target .pic{font-size:48px}
.road{position:relative;flex:1;min-height:240px;background:var(--road);border-radius:24px;overflow:hidden;border:6px solid #2A2939;box-shadow:0 6px 0 rgba(29,26,58,.3);touch-action:none}
.road::before,.road::after{content:"";position:absolute;top:-60px;bottom:0;width:6px;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.75) 0 30px,transparent 30px 60px);animation:dash .6s linear infinite}
.road::before{left:calc(33.33% - 3px)}
.road::after{left:calc(66.66% - 3px)}
.road.slow::before,.road.slow::after{animation-duration:1s}
.row{position:absolute;left:0;right:0;top:0;display:grid;grid-template-columns:repeat(3,1fr);z-index:2;transition:opacity .3s}
.row.fade{opacity:0}
.chip{justify-self:center;font-size:30px;background:var(--sun);color:var(--ink);padding:4px 12px;border-radius:16px;box-shadow:0 5px 0 #C9921B;min-width:68px;text-align:center}
.chip.good{background:var(--mint);box-shadow:0 5px 0 #138C73;color:var(--white);transform:scale(1.2);transition:transform .2s}
.chip.bad{background:var(--tomato);box-shadow:0 5px 0 #B53A20;color:var(--white)}
.car{position:absolute;bottom:14px;left:33.33%;width:33.33%;height:90px;display:flex;justify-content:center;transition:left .16s ease-out;z-index:3}
.cbody{width:52px;height:86px;border-radius:20px 20px 14px 14px;position:relative;background:linear-gradient(90deg,transparent 42%,var(--white) 42% 58%,transparent 58%),var(--tomato);box-shadow:inset 0 -8px 0 rgba(0,0,0,.2)}
.cbody::before{content:"";position:absolute;left:7px;right:7px;top:18px;height:18px;background:#BDE7FF;border-radius:6px}
.cbody::after{content:"";position:absolute;left:-7px;top:10px;width:8px;height:18px;border-radius:3px;background:#15141F;box-shadow:58px 0 0 #15141F,0 48px 0 #15141F,58px 48px 0 #15141F}
.flame{position:absolute;bottom:-26px;width:26px;height:30px;border-radius:50% 50% 50% 50%/30% 30% 70% 70%;background:linear-gradient(var(--sun),var(--tomato));opacity:0;transform:rotate(180deg)}
.car.turbo .cbody{animation:turbo 1.4s ease-in-out}
.car.turbo .flame{opacity:1;animation:flick .12s infinite alternate}
.car.shake .cbody{animation:shake .4s}
.pads{display:flex;gap:12px}
.pad{flex:1;height:66px;font-size:34px}

/* Gasolinera */
.sign{display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 14px;border:5px solid var(--mint)}
.sign .sw{font-size:42px;letter-spacing:.08em}
.pumprow{display:flex;align-items:center;gap:12px;justify-content:center}
.gcar{font-size:62px;line-height:1;transition:transform 1.2s ease-in}
.gcar.drive{transform:translateX(-120vw)}
.gauge{flex:1;max-width:240px;height:30px;border-radius:999px;background:var(--white);border:4px solid var(--ink);overflow:hidden;position:relative}
.fuel{height:100%;width:0;background:linear-gradient(90deg,var(--tomato),var(--sun),var(--mint));transition:width .3s}
.tiles.pump .tile{background:var(--tomato);color:var(--white);box-shadow:0 6px 0 #B53A20}

/* Reparto */
.street{display:flex;gap:10px;justify-content:center;align-items:flex-end;margin-top:6px}
.house{flex:1;max-width:150px;display:flex;flex-direction:column;align-items:center;background:transparent;padding:0;border-radius:0;transition:transform .1s}
.house:active{transform:scale(.97)}
.roof{width:100%;aspect-ratio:2/1;background:var(--c);clip-path:polygon(50% 0,100% 100%,0 100%)}
.hb{width:86%;background:var(--paper);display:flex;flex-direction:column;align-items:center;padding:12px 4px 0;border-radius:0 0 10px 10px;box-shadow:0 6px 0 rgba(29,26,58,.25)}
.hb .wd{font-size:clamp(15px,4.6vw,34px);background:var(--white);border:3px solid var(--ink);border-radius:10px;padding:0 5px;white-space:nowrap}
.door{width:34%;height:44px;background:#8A5A3B;border-radius:10px 10px 0 0;margin-top:12px;transition:background .3s}
.house.yes .door{background:var(--sun)}
.house.yes .hb{animation:pop .4s}
.lane2{position:relative;height:150px;background:var(--road);border-radius:20px;border:6px solid #2A2939;margin-top:auto}
.lane2::before{content:"";position:absolute;left:0;right:0;top:calc(50% - 3px);height:6px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.7) 0 30px,transparent 30px 60px)}
.truck{position:absolute;bottom:8px;left:calc(50% - 45px);width:90px;display:flex;flex-direction:column;align-items:center;transition:left .9s ease-in-out}
.pkg{background:#D9A066;border:3px solid #8A5A3B;border-radius:12px;padding:4px 8px;margin-bottom:-6px}
.pkg .pic{font-size:44px}
.tk{font-size:62px;line-height:1;transform:scaleX(-1)}

/* Monstruo */
.mzone{display:flex;flex-direction:column;align-items:center;gap:8px}
.say{position:relative;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;padding:10px 14px;font-size:22px;font-weight:800}
.say::after{content:"";position:absolute;bottom:-14px;left:50%;margin-left:-12px;border:12px solid transparent;border-top-color:var(--paper);border-bottom:0}
.say .wd{font-size:34px;color:var(--grape)}
.say .pic{font-size:40px}
.monster{position:relative;width:180px;height:150px;margin-top:8px}
.mb{position:absolute;inset:0;background:var(--grape);border-radius:50% 50% 44% 44%;box-shadow:inset 0 -14px 0 rgba(0,0,0,.18),0 6px 0 rgba(29,26,58,.25);display:flex;justify-content:center;gap:16px;padding-top:30px}
.horn{position:absolute;top:-16px;width:30px;height:36px;background:var(--sun);clip-path:polygon(50% 0,100% 100%,0 100%)}
.horn.l{left:30px;transform:rotate(-14deg)}
.horn.r{right:30px;transform:rotate(14deg)}
.eye{width:44px;height:44px;border-radius:50%;background:var(--white);display:grid;place-items:center}
.eye i{width:18px;height:18px;border-radius:50%;background:var(--ink);animation:look 3s ease-in-out infinite}
.mouth{position:absolute;left:50%;bottom:22px;width:84px;height:40px;margin-left:-42px;background:#2A1240;border-radius:12px 12px 42px 42px;transform-origin:center top;overflow:hidden}
.mouth::before{content:"";position:absolute;left:12px;right:12px;top:0;height:10px;background:repeating-linear-gradient(90deg,var(--white) 0 12px,transparent 12px 20px)}
.monster.chomp .mouth{animation:chomp .35s}
.monster.happy .mb{animation:jump .7s}
.burp{font-size:30px;font-weight:800;color:var(--tomato);-webkit-text-stroke:1px var(--white);height:36px;opacity:0;transition:opacity .2s}
.burp.on{opacity:1;animation:pop .4s}
.bubbles{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding-bottom:6px}
.bub{width:86px;height:86px;border-radius:50%;font-size:30px;background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.95) 0 10%,transparent 11%),var(--pink);color:var(--white);box-shadow:0 6px 0 #C24C80;animation:bob 2.2s ease-in-out infinite;animation-delay:var(--d)}
.bub.eaten{animation:eaten .45s forwards}

/* Cohete */
.cgrid{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:12px;align-items:end}
.cleft{display:flex;flex-direction:column;gap:12px;align-self:center}
.cword{text-align:center;font-size:clamp(40px,12vw,64px);padding:10px;color:var(--ink)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:12px}
.choice{height:100px;font-size:58px;border-radius:22px}
.rocket{position:relative;width:110px;height:270px;justify-self:center}
.part{position:absolute;opacity:.2;filter:grayscale(1)}
.part.on{opacity:1;filter:none;animation:pop .4s}
.nose{left:25px;top:0;width:60px;height:60px;background:var(--tomato);clip-path:polygon(50% 0,100% 100%,0 100%)}
.rbody{left:25px;top:58px;width:60px;height:122px;background:var(--paper);border-radius:8px;z-index:2}
.win{left:37px;top:80px;width:36px;height:36px;border-radius:50%;background:var(--sky2);border:5px solid var(--grape);z-index:3}
.fins{left:3px;top:130px;width:104px;height:62px;background:var(--grape);clip-path:polygon(22% 0,78% 0,100% 100%,62% 72%,38% 72%,0 100%)}
.fire{left:37px;top:180px;width:36px;height:62px;background:linear-gradient(var(--sun),var(--tomato));border-radius:50% 50% 50% 50%/30% 30% 70% 70%}
.fire.on{animation:pop .4s,flick .12s .4s infinite alternate}
.rocket.go{animation:launch 2.2s ease-in forwards}

/* Zoo */
.cage{position:relative;align-self:center;width:190px;height:170px;display:grid;place-items:center;background:#CFEFC9;border-radius:24px;border:6px solid #8A5A3B;overflow:hidden;box-shadow:0 6px 0 rgba(29,26,58,.25)}
.cage .pic{font-size:96px;transition:transform .4s}
.bars{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 24px,#5B5A6C 24px 32px);transition:transform .7s ease-in}
.cage.open .bars{transform:translateY(-110%)}
.cage.open .pic{animation:jump .8s}
.cage .hear{position:absolute;right:8px;bottom:8px;z-index:2}
.zgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px;padding-block:8px 30px}
.zcell{display:flex;flex-direction:column;align-items:center;padding:10px 4px;border-radius:20px}
.zcell span{font-size:54px;line-height:1.1}
.zcell b{font-size:20px}
.empty{background:var(--paper);border-radius:22px;padding:22px;text-align:center;font-size:19px;font-weight:700;max-width:460px;margin:20px auto}

/* Final */
.over{position:fixed;inset:0;background:rgba(29,26,58,.55);display:grid;place-items:center;z-index:40;padding:20px}
.ocard{background:var(--paper);border-radius:30px;padding:24px 20px;width:100%;max-width:380px;text-align:center;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 0 rgba(29,26,58,.35);animation:pop .4s}
.ocard h3{margin:0;font-size:36px;font-weight:800;line-height:1}
.ocard p{margin:0;font-size:18px;font-weight:600}
.bigstars{font-size:58px;letter-spacing:4px;line-height:1}
.bigstars .off{filter:grayscale(1);opacity:.3}
.obtn{height:58px;font-size:21px;border-radius:18px;color:var(--white)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall var(--d) ease-in forwards}


/* Presentación SantiSystems Games */
#intro{position:fixed;inset:0;z-index:90;background:var(--sky);background-image:radial-gradient(rgba(255,255,255,.2) 2px,transparent 2.6px);background-size:28px 28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;cursor:pointer;transition:opacity .4s}
#intro .ss{display:flex;align-items:center;gap:12px;opacity:0;animation:fin .7s .2s forwards}
#intro .ssm{width:54px;height:54px;border-radius:14px;background:linear-gradient(135deg,#ffb13b,#ff6a3d);display:grid;place-items:center;font:800 italic 30px/1 system-ui,sans-serif;color:#1b1030;box-shadow:0 5px 0 rgba(29,26,58,.3)}
#intro .ssn{font-weight:800;font-size:clamp(26px,7vw,40px);line-height:1;color:var(--white);text-align:left;text-shadow:0 3px 0 rgba(29,26,58,.3)}
#intro .ssn small{display:block;font-size:13px;line-height:1.6;letter-spacing:.42em;color:#1D1A3A}
#intro .pr{font-size:16px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--white);opacity:0;animation:fin .7s .8s forwards}
#intro .t2{display:none;flex-direction:column;align-items:center;gap:14px}
#intro .t2 .em{font-size:clamp(70px,18vw,120px);line-height:1;animation:pop .6s}
#intro .tap{margin-top:8px;background:var(--white);color:var(--ink);font-weight:800;font-size:22px;padding:12px 26px;border-radius:18px;box-shadow:0 6px 0 rgba(29,26,58,.28);animation:bob 1.6s ease-in-out infinite}
#intro.two .ss,#intro.two .pr{display:none}#intro.two .t2{display:flex}
@keyframes fin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes dash{to{transform:translateY(60px)}}
@keyframes turbo{0%{transform:translateY(0)}40%{transform:translateY(-34px) scale(1.08)}100%{transform:translateY(0)}}
@keyframes flick{from{transform:rotate(180deg) scaleY(.8)}to{transform:rotate(180deg) scaleY(1.2)}}
@keyframes chomp{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.15)}}
@keyframes jump{0%,100%{transform:translateY(0)}30%{transform:translateY(-26px)}60%{transform:translateY(0)}80%{transform:translateY(-8px)}}
@keyframes eaten{to{transform:translateY(-160px) scale(.2);opacity:0}}
@keyframes look{0%,100%{transform:translateX(0)}30%{transform:translateX(-8px)}70%{transform:translateX(8px)}}
@keyframes launch{0%{transform:translateY(0)}15%{transform:translateY(6px)}100%{transform:translateY(-130vh)}}
@keyframes fall{to{transform:translate(var(--x),110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.logo span,.lvicon,.bub,.eye i{animation:none}.confetti{display:none}}
</style>

</head>
<body>
<div id="intro" role="button" aria-label="Empezar">
  <div class="ss"><div class="ssm">S</div><div class="ssn">SantiSystems<small>GAMES</small></div></div>
  <div class="pr">presenta</div>
  <div class="t2"><div class="em">📚</div><h1 class="logo" id="logo2">Lectolandia</h1><div class="tap">¡A jugar! ▶</div></div>
</div>
<section id="menu" class="screen on gut">
  <div class="top">
    <button class="btn chipbtn site" id="ssInstall" hidden>📲<span class="lg"> Instalar</span></button>
    <button class="btn chipbtn site" id="ssExitBtn">✕ Salir<span class="lg"> del juego</span></button>
    <span class="topsp"></span>
    <button class="btn chipbtn" id="zbtn">🦁 Mi zoo</button>
    <button class="btn chipbtn wd" id="case" aria-label="Cambiar mayúsculas o minúsculas">ABC</button>
    <button class="btn chipbtn" id="snd" aria-label="Sonido">🔊</button>
  </div>
  <h1 class="logo" id="logo">Lectolandia</h1>
  <p class="sub">Elige un juego</p>
  <div class="grid" id="grid"></div>

</section>

<section id="lv" class="screen">
  <header class="hdr gut"><button class="btn sm" data-to="menu" aria-label="Volver">⬅</button><h2 id="lvt"></h2></header>
  <div class="lvbox gut"><div class="lvicon" id="lvi"></div><div class="lvlist" id="lvl"></div></div>
</section>

<section id="play" class="screen">
  <header class="hdr gut"><button class="btn sm" id="quit" aria-label="Salir">⬅</button><h2 id="ptitle"></h2><div class="dots" id="dots"></div></header>
  <main id="stage" class="stage gut"></main>
</section>

<section id="zoov" class="screen">
  <header class="hdr gut"><button class="btn sm" data-to="menu" aria-label="Volver">⬅</button><h2>Mi zoo</h2></header>
  <div class="gut" id="zwrap"></div>
</section>

<script>
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>shuffle(a).slice(0,n);
const mk=([s,e])=>({s:s.split('-'),w:s.replace(/-/g,''),e});

/* ---------- Palabras ---------- */
const L1=[['GA-TO','🐱'],['PA-TO','🦆'],['SO-PA','🍲'],['LU-NA','🌙'],['CA-SA','🏠'],['MA-NO','✋'],['VA-CA','🐄'],['PE-RA','🍐'],['RA-NA','🐸'],['BO-TA','👢'],['RO-SA','🌹'],['FO-CA','🦭'],['LO-RO','🦜'],['MO-NO','🐒'],['TA-ZA','☕'],['NU-BE','☁️'],['MO-TO','🏍️'],['DA-DO','🎲'],['LO-BO','🐺'],['PI-ÑA','🍍'],['SE-TA','🍄']].map(mk);
const L2=[['PE-RRO','🐶'],['CO-CHE','🚗'],['LLA-VE','🔑'],['QUE-SO','🧀'],['HUE-VO','🥚'],['FRE-SA','🍓'],['GLO-BO','🎈'],['CE-BRA','🦓'],['PUL-PO','🐙'],['LI-MÓN','🍋'],['CA-MIÓN','🚚'],['DEL-FÍN','🐬'],['TI-GRE','🐯'],['LE-CHE','🥛'],['SI-LLA','🪑'],['BAR-CO','⛵'],['LE-ÓN','🦁'],['CER-DO','🐷'],['PAN-DA','🐼']].map(mk);
const L3=[['PE-LO-TA','⚽'],['ZA-PA-TO','👞'],['TO-MA-TE','🍅'],['PA-TA-TA','🥔'],['CA-BA-LLO','🐴'],['CO-NE-JO','🐰'],['GA-LLI-NA','🐔'],['CA-ME-LLO','🐫'],['PA-LO-MA','🕊️'],['MAN-ZA-NA','🍎'],['BA-LLE-NA','🐋'],['MA-LE-TA','🧳'],['CO-RO-NA','👑'],['CA-MI-SA','👕'],['TOR-TU-GA','🐢'],['JI-RA-FA','🦒'],['PA-YA-SO','🤡'],['ES-CO-BA','🧹'],['HE-LA-DO','🍦'],['PLÁ-TA-NO','🍌'],['GU-SA-NO','🐛'],['CE-RE-ZA','🍒'],['GA-LLE-TA','🍪']].map(mk);
const SHORT=[['SOL','☀️'],['PEZ','🐟'],['O-SO','🐻'],['PAN','🍞'],['U-VA','🍇'],['PIE','🦶'],['MAR','🌊'],['LUZ','💡']].map(mk);
const POOL={1:L1,2:L2,3:L3};
const LET={1:SHORT,2:L1,3:L3.filter(w=>w.w.length<=7)};
const byW=w=>[...L1,...L2,...L3,...SHORT].find(x=>x.w===w);
const ANIM={1:['GATO','PATO','VACA','RANA','FOCA','LORO','MONO','LOBO','OSO','PEZ'],2:['PERRO','CEBRA','PULPO','TIGRE','LEÓN','CERDO','PANDA','DELFÍN'],3:['CABALLO','CONEJO','GALLINA','CAMELLO','PALOMA','BALLENA','TORTUGA','JIRAFA','GUSANO']};
Object.keys(ANIM).forEach(k=>ANIM[k]=ANIM[k].map(byW));
const FOOD={1:['SOPA','PERA','PIÑA','UVA','SETA'].map(byW),2:['QUESO','HUEVO','FRESA','LIMÓN','LECHE'].map(byW),3:['TOMATE','PATATA','MANZANA','HELADO','PLÁTANO','CEREZA','GALLETA'].map(byW)};
const SYL={};[1,2,3].forEach(l=>SYL[l]=[...new Set(POOL[l].flatMap(w=>w.s))]);
const distractSyl=(ex,n,L)=>pick(SYL[L].filter(s=>!ex.includes(s)),n);
const distractLet=(word,n)=>pick('AEIOUMPSLTNRCDB'.split('').filter(c=>!word.includes(c)),n);
function similar(t,pool,n){return pool.filter(c=>c.w!==t.w&&c.e!==t.e).map(c=>({c,k:(c.w.length===t.w.length?1:0)+(c.w[0]===t.w[0]?2:0)+(c.s[c.s.length-1]===t.s[t.s.length-1]?2:0)+(c.s.length===t.s.length?1:0)+Math.random()*1.5})).sort((a,b)=>b.k-a.k).slice(0,n).map(x=>x.c)}

/* ---------- Guardado ---------- */
let P={stars:{},zoo:[],lower:false,all:false,mute:false};
try{const s=localStorage.getItem('lectolandia-v1');if(s)P=Object.assign(P,JSON.parse(s))}catch(e){}
const save=()=>{try{localStorage.setItem('lectolandia-v1',JSON.stringify(P))}catch(e){}};
const unlocked=(id,l)=>l===1||P.all||(P.stars[id+'-'+(l-1)]||0)>0;

/* ---------- Sonido y voz ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d=.12,type='sine',v=.18,when=0,f2){const a=ac();if(!a||P.mute)return;const t=a.currentTime+when;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.03)}
const sfx={
  good(){tone(660,.1,'triangle');tone(990,.16,'triangle',.18,.08)},
  bad(){tone(200,.25,'sawtooth',.1,0,120)},
  tap(){tone(520,.05,'square',.05)},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.18,i*.1))},
  burp(){tone(130,.5,'sawtooth',.16,0,55)},
  vroom(){tone(90,.8,'sawtooth',.1,0,320)}
};
let VOICE=null;
function loadV(){try{const vs=speechSynthesis.getVoices();VOICE=vs.find(v=>/es[-_]ES/i.test(v.lang))||vs.find(v=>/^es/i.test(v.lang))||null}catch(e){}}
if(window.speechSynthesis){loadV();speechSynthesis.onvoiceschanged=loadV}
function say(t){if(P.mute||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.toLowerCase());u.lang='es-ES';if(VOICE)u.voice=VOICE;u.rate=.85;u.pitch=1.15;speechSynthesis.speak(u)}catch(e){}}

function confetti(n=60){const box=document.createElement('div');box.className='confetti';const cols=['#FF5B3A','#FFC83D','#1FC2A0','#7B4FE0','#FF6BA9','#43B0F1'];for(let i=0;i<n;i++){const s=document.createElement('i');s.style.left=Math.random()*100+'%';s.style.background=cols[i%6];s.style.setProperty('--d',(1.2+Math.random()*1.4)+'s');s.style.setProperty('--x',(Math.random()*160-80)+'px');s.style.animationDelay=Math.random()*.4+'s';box.appendChild(s)}document.body.appendChild(box);setTimeout(()=>box.remove(),3300)}
const reshake=el=>{el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')};
const slotsHTML=(parts,ghost)=>parts.map(p=>`<div class="slot wd">${ghost?p:''}</div>`).join('');
const norm=t=>t.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
/* Teclado: flechas para moverse por las fichas y Enter o espacio para elegir */
function keyPick(box,sel,fn,e,opt){
  opt=opt||{};const list=$$(sel,box).filter(b=>!b.classList.contains('used')&&!b.classList.contains('eaten')&&b.style.visibility!=='hidden');
  if(!list.length)return;
  let i=list.findIndex(b=>b.classList.contains('kf'));
  const mv=d=>{e.preventDefault();$$('.kf',box).forEach(x=>x.classList.remove('kf'));i=i<0?(d>0?0:list.length-1):(i+d+list.length)%list.length;list[i].classList.add('kf');sfx.tap();if(list[i].scrollIntoView)list[i].scrollIntoView({block:'nearest',inline:'nearest'})};
  if(e.key==='ArrowRight'||e.key==='ArrowDown')return mv(1);
  if(e.key==='ArrowLeft'||e.key==='ArrowUp')return mv(-1);
  if(e.key==='Enter'||e.key===' '||e.key==='Spacebar'){e.preventDefault();if(i<0){mv(1);return}const b=list[i];fn(b);
    // si la ficha desaparece, el cursor pasa a la siguiente que quede
    setTimeout(()=>{if(!b.isConnected||b.classList.contains('used')||b.classList.contains('eaten')){const l2=$$(sel,box).filter(x=>!x.classList.contains('used')&&!x.classList.contains('eaten'));$$('.kf',box).forEach(x=>x.classList.remove('kf'));if(l2.length)l2[Math.min(i,l2.length-1)].classList.add('kf')}},0);return}
  if(opt.nums){const n=parseInt(e.key,10);if(n>=1&&n<=list.length){$$('.kf',box).forEach(x=>x.classList.remove('kf'));list[n-1].classList.add('kf');fn(list[n-1])}}
}
let KBD=false;addEventListener('keydown',()=>{if(!KBD){KBD=true;document.body.classList.add('kbd')}},true);addEventListener('pointerdown',()=>{if(KBD){KBD=false;document.body.classList.remove('kbd');$$('.kf').forEach(x=>x.classList.remove('kf'))}},true);
function fillSlot(box,i,txt){const s=box.children[i];s.textContent=txt;s.classList.add('ok')}

/* ---------- Juegos ---------- */
const GAMES={
  carrera:{name:'Carrera de sílabas',icon:'🏎️',c:'var(--tomato)',desc:'Conduce y recoge las sílabas',lv:['Palabras fáciles','Sílabas difíciles','Palabras largas y más rápido'],play:playCarrera},
  gasolinera:{name:'Gasolinera',icon:'⛽',c:'var(--mint)',desc:'Llena el depósito con letras',lv:['Palabras de 3 letras','Palabras de 4 letras','Palabras largas, sin cartel'],play:playGas},
  reparto:{name:'Camión de reparto',icon:'🚚',c:'#E8A51C',desc:'Lleva cada paquete a su casa',lv:['2 casas','3 casas','Casas con nombres parecidos'],play:playReparto},
  monstruo:{name:'Monstruo comepalabras',icon:'👾',c:'var(--grape)',desc:'Dale de comer sílabas',lv:['Comidas cortas','Comidas difíciles','Adivina qué quiere'],play:playMonstruo},
  cohete:{name:'Cohete espacial',icon:'🚀',c:'var(--pink)',desc:'Lee y construye el cohete',lv:['Palabras fáciles','Más palabras','Palabras largas'],play:playCohete},
  zoo:{name:'Zoo mágico',icon:'🦁',c:'var(--orange)',desc:'Forma su nombre y libéralo',lv:['Animales cortos','Animales medianos','Animales largos'],play:playZoo}
};

function playCarrera(api){
  const L=api.lvl,st=api.stage,words=pick(POOL[L],5);let wi=-1,need=0,lane=1,row=null;
  st.innerHTML=`<div class="target panel"><div class="pic"></div><div class="slots"></div><button class="btn sm hear" aria-label="Escuchar">🔊</button></div>
  <div class="road${L===1?' slow':''}"><div class="car"><div class="cbody"></div><div class="flame"></div></div></div>
  <p class="kh">En el ordenador: flechas ← → del teclado</p><div class="pads"><button class="btn pad" data-d="-1" aria-label="Izquierda">◀</button><button class="btn pad" data-d="1" aria-label="Derecha">▶</button></div>`;
  const road=$('.road',st),car=$('.car',st),slots=$('.slots',st);
  const setLane=n=>{lane=Math.max(0,Math.min(2,n));car.style.left=(lane*33.333)+'%'};
  $$('.pad',st).forEach(b=>b.onpointerdown=e=>{e.preventDefault();setLane(lane+ +b.dataset.d);sfx.tap()});
  road.onpointerdown=e=>{const r=road.getBoundingClientRect();setLane(Math.floor((e.clientX-r.left)/r.width*3));sfx.tap()};
  api.key(e=>{if(e.key==='ArrowLeft'){e.preventDefault();setLane(lane-1)}if(e.key==='ArrowRight'){e.preventDefault();setLane(lane+1)}});
  $('.hear',st).onclick=()=>say(words[wi].w);
  function next(){wi++;need=0;const w=words[wi];$('.pic',st).textContent=w.e;slots.innerHTML=slotsHTML(w.s,L<3);say(w.w);api.after(900,spawn)}
  function spawn(){const t=words[wi].s[need];const cells=shuffle([t,...distractSyl([t],2,L)]);const el=document.createElement('div');el.className='row';el.innerHTML=cells.map(c=>`<div class="chip wd">${c}</div>`).join('');road.appendChild(el);row={y:-60,cells,el}}
  const spd=[0,.17,.22,.28][L];
  api.loop(dt=>{if(!row)return;const h=road.clientHeight;row.y+=h*spd*dt;row.el.style.transform=`translateY(${row.y}px)`;if(row.y+48>=h-14-86)hit()});
  function hit(){const r=row;row=null;const w=words[wi],t=w.s[need],got=r.cells[lane],el=r.el.children[lane];
    if(got===t){el.classList.add('good');sfx.good();say(got);fillSlot(slots,need,got);need++;
      if(need===w.s.length){car.classList.add('turbo');sfx.vroom();confetti(20);api.after(450,()=>say(w.w));api.after(1500,()=>car.classList.remove('turbo'));r.el.classList.add('fade');api.after(300,()=>r.el.remove());if(!api.point(1600))api.after(1900,next);return}
    }else{el.classList.add('bad');api.miss();car.classList.remove('shake');void car.offsetWidth;car.classList.add('shake')}
    api.after(250,()=>r.el.classList.add('fade'));api.after(550,()=>{r.el.remove();spawn()})}
  setLane(1);next();
}

function playGas(api){
  const L=api.lvl,st=api.stage,words=pick(LET[L],5);let wi=-1,pos=0,w;
  st.innerHTML=`<p class="hint">${L<3?'Copia la palabra del cartel':'¿Qué palabra es? Fórmala con las letras'}</p>
  <div class="sign panel"><span class="pic"></span><span class="sw wd"></span><button class="btn sm hear" aria-label="Escuchar">🔊</button></div>
  <div class="pumprow"><div class="gcar">🚙</div><div class="gauge"><div class="fuel"></div></div></div>
  <div class="slots big"></div><div class="tiles pump"></div><p class="kh">En el ordenador: flechas ← → para elegir y Enter para coger</p>`;
  const slots=$('.slots',st),tiles=$('.tiles',st),fuel=$('.fuel',st),gcar=$('.gcar',st);
  $('.hear',st).onclick=()=>say(w.w);
  api.key(e=>keyPick(tiles,'.tile',tap,e));
  function next(){wi++;pos=0;w=words[wi];$('.pic',st).textContent=w.e;$('.sw',st).textContent=L<3?w.w:'';
    const letters=w.w.split('');slots.innerHTML=slotsHTML(letters,L===1);fuel.style.width='0';
    gcar.style.transition='none';gcar.classList.remove('drive');void gcar.offsetWidth;gcar.style.transition='';
    const set=shuffle(letters.concat(L===3?distractLet(w.w,2):[]));
    tiles.innerHTML=set.map(c=>`<button class="btn tile wd">${c}</button>`).join('');
    $$('.tile',tiles).forEach(b=>b.onclick=()=>tap(b));say(w.w)}
  function tap(b){if(pos>=w.w.length)return;if(b.textContent===w.w[pos]){b.classList.add('used');fillSlot(slots,pos,b.textContent);pos++;fuel.style.width=(pos/w.w.length*100)+'%';sfx.good();
      if(pos===w.w.length){say(w.w);confetti(20);api.after(500,()=>{gcar.classList.add('drive');sfx.vroom()});if(!api.point(1700))api.after(1900,next)}}
    else{reshake(b);api.miss()}}
  next();
}

function playReparto(api){
  const L=api.lvl,st=api.stage,pool=L===1?L1:L===2?L1.concat(L2):L2.concat(L3),targets=pick(pool,5),cols=['var(--tomato)','var(--grape)','var(--mint)','var(--pink)','var(--sky2)'];let i=-1,t,lock=false;
  st.innerHTML=`<p class="hint">Lee los carteles y lleva el paquete a su casa</p><p class="kh">En el ordenador: flechas ← → y Enter (o los números 1, 2, 3)</p><div class="street"></div><div class="lane2"><div class="truck"><div class="pkg"><span class="pic"></span></div><div class="tk">🚚</div></div></div>`;
  const street=$('.street',st),truck=$('.truck',st),lane=$('.lane2',st);
  api.key(e=>keyPick(street,'.house',go,e,{nums:1}));
  function next(){i++;t=targets[i];lock=false;const n=L===1?2:3;
    const opts=L===3?similar(t,pool,n-1):pick(pool.filter(x=>x.w!==t.w&&x.e!==t.e),n-1);
    const houses=shuffle([t,...opts]);
    street.innerHTML=houses.map((h,k)=>`<button class="house" data-w="${h.w}" style="--c:${cols[(i+k)%5]}"><div class="roof"></div><div class="hb"><span class="wd">${h.w}</span><div class="door"></div></div></button>`).join('');
    truck.style.transition='none';truck.style.left='calc(50% - 45px)';void truck.offsetWidth;truck.style.transition='';
    $('.pic',truck).textContent=t.e;
    $$('.house',street).forEach(b=>b.onclick=()=>go(b))}
  function go(b){if(lock)return;if(b.dataset.w===t.w){lock=true;const r=b.getBoundingClientRect(),lr=lane.getBoundingClientRect();truck.style.left=(r.left+r.width/2-lr.left-45-6)+'px';sfx.vroom();
      api.after(900,()=>{b.classList.add('yes');sfx.good();say(t.w);confetti(20)});if(!api.point(2000))api.after(2200,next)}
    else{reshake(b);api.miss()}}
  next();
}

function playMonstruo(api){
  const L=api.lvl,st=api.stage,words=pick(FOOD[L],5);let wi=-1,pos=0,w,busy=false;
  st.innerHTML=`<div class="mzone"><div class="say panel"><span>¡Quiero comer</span><b class="mw wd"></b><span class="pic"></span><button class="btn sm hear" aria-label="Escuchar">🔊</button></div>
  <div class="monster"><div class="horn l"></div><div class="horn r"></div><div class="mb"><div class="eye"><i></i></div><div class="eye"><i></i></div><div class="mouth"></div></div></div>
  <div class="burp">¡BUAAARP!</div><div class="slots"></div></div><p class="hint">Dale las sílabas en orden</p><div class="bubbles"></div><p class="kh">En el ordenador: flechas ← → para elegir y Enter para coger</p>`;
  const slots=$('.slots',st),bubs=$('.bubbles',st),mon=$('.monster',st),burp=$('.burp',st);
  $('.hear',st).onclick=()=>say('quiero comer '+w.w);
  api.key(e=>keyPick(bubs,'.bub',feed,e));
  function next(){wi++;pos=0;busy=false;w=words[wi];$('.mw',st).textContent=L<3?w.w:'';$('.pic',st).textContent=w.e;slots.innerHTML=slotsHTML(w.s,false);mon.classList.remove('happy');
    const set=shuffle(w.s.concat(distractSyl(w.s,L,L)));
    bubs.innerHTML=set.map(s=>`<button class="btn bub wd" style="--d:${(Math.random()*1.5).toFixed(2)}s">${s}</button>`).join('');
    $$('.bub',bubs).forEach(b=>b.onclick=()=>feed(b));say(L<3?'quiero comer '+w.w:'¿qué quiero comer?')}
  function feed(b){if(busy||b.classList.contains('eaten'))return;
    if(b.textContent===w.s[pos]){b.classList.add('eaten');fillSlot(slots,pos,b.textContent);pos++;sfx.good();say(b.textContent);mon.classList.remove('chomp');void mon.offsetWidth;mon.classList.add('chomp');
      if(pos===w.s.length){busy=true;api.after(500,()=>{mon.classList.add('happy');say('ñam, ñam, '+w.w);confetti(20)});if(!api.point(1800))api.after(2100,next)}}
    else{reshake(b);api.miss();sfx.burp();burp.classList.remove('on');void burp.offsetWidth;burp.classList.add('on');api.after(900,()=>burp.classList.remove('on'))}}
  next();
}

function playCohete(api){
  const L=api.lvl,st=api.stage,pool=L===1?L1:L===2?L1.concat(L2):L3,words=pick(pool,5);let wi=-1,w,lock=false;
  st.innerHTML=`<div class="cgrid"><div class="cleft"><p class="hint">Lee la palabra y toca su dibujo</p><p class="kh">En el ordenador: flechas ← → y Enter (o los números)</p><div class="cword wd panel"></div><div class="choices"></div></div>
  <div class="rocket"><div class="part fins" data-k="1"></div><div class="part rbody" data-k="2"></div><div class="part win" data-k="3"></div><div class="part nose" data-k="4"></div><div class="part fire" data-k="5"></div></div></div>`;
  const ch=$('.choices',st),rocket=$('.rocket',st);
  api.key(e=>keyPick(ch,'.choice',choose,e,{nums:1}));
  function next(){wi++;lock=false;w=words[wi];$('.cword',st).textContent=w.w;const n=L===3?4:3;
    const opts=shuffle([w,...(L===3?similar(w,pool,n-1):pick(pool.filter(x=>x.w!==w.w&&x.e!==w.e),n-1))]);
    ch.innerHTML=opts.map(o=>`<button class="btn choice" data-w="${o.w}">${o.e}</button>`).join('');
    $$('.choice',ch).forEach(b=>b.onclick=()=>choose(b))}
  function choose(b){if(lock)return;if(b.dataset.w===w.w){lock=true;sfx.good();say(w.w);$(`.part[data-k="${wi+1}"]`,rocket).classList.add('on');
      if(wi===4){api.after(700,()=>{rocket.classList.add('go');sfx.vroom();say('¡tres, dos, uno, despegue!')});api.point(3200)}else{confetti(14);api.point();api.after(1100,next)}}
    else{reshake(b);api.miss()}}
  next();
}

function playZoo(api){
  const L=api.lvl,st=api.stage,words=pick(ANIM[L],5);let wi=-1,pos=0,w;
  st.innerHTML=`<p class="hint">Forma su nombre para abrir la jaula</p><div class="cage"><span class="pic"></span><div class="bars"></div><button class="btn sm hear" aria-label="Escuchar">🔊</button></div><div class="slots big"></div><div class="tiles"></div><p class="kh">En el ordenador: flechas ← → para elegir y Enter para coger</p>`;
  const cage=$('.cage',st),slots=$('.slots',st),tiles=$('.tiles',st);
  $('.hear',st).onclick=()=>say(w.w);
  api.key(e=>keyPick(tiles,'.tile',tap,e));
  function next(){wi++;pos=0;w=words[wi];$('.pic',cage).textContent=w.e;cage.classList.remove('open');const letters=w.w.split('');slots.innerHTML=slotsHTML(letters,L===1);
    tiles.innerHTML=shuffle(letters.concat(L>1?distractLet(w.w,L-1):[])).map(c=>`<button class="btn tile wd">${c}</button>`).join('');
    $$('.tile',tiles).forEach(b=>b.onclick=()=>tap(b))}
  function tap(b){if(pos>=w.w.length)return;if(b.textContent===w.w[pos]){b.classList.add('used');fillSlot(slots,pos,b.textContent);pos++;sfx.good();
      if(pos===w.w.length){cage.classList.add('open');say(w.w);confetti(24);if(!P.zoo.includes(w.w)){P.zoo.push(w.w);save()}if(!api.point(1700))api.after(1900,next)}}
    else{reshake(b);api.miss()}}
  next();
}

/* ---------- Motor ---------- */
let cur=null,keyFn=null;
document.addEventListener('keydown',e=>{if(window.__lectoIntro&&window.__lectoIntro(e))return;
  const ov=$('.over');if(ov){keyPick(ov,'.obtn',b=>b.click(),e);return}
  if(keyFn){keyFn(e);return}
  const scr=$('.screen.on');if(!scr)return;
  if(e.key==='Escape'&&scr.id!=='menu'){goMenu();return}
  if(scr.id==='menu')keyPick($('#grid'),'.gcard',b=>b.click(),e);
  else if(scr.id==='lv')keyPick($('#lvl'),'.lvb',b=>b.click(),e);
  else if(scr.id==='zoov')keyPick($('#zwrap'),'.zcell',b=>b.click(),e);});
// Mando (PlayStation / Xbox): cruceta o palanca para moverse, A/X para elegir, B/círculo para volver
(function(){const prev={};let ax=0;const fire=k=>document.dispatchEvent(new KeyboardEvent('keydown',{key:k,bubbles:true}));
  function tick(){const gs=navigator.getGamepads?navigator.getGamepads():[];let g=null;for(const x of gs)if(x){g=x;break}
    if(g){const p=i=>{const b=g.buttons[i],v=!!(b&&(b.pressed||b.value>.5)),w=prev[i];prev[i]=v;return v&&!w};
      if(p(14))fire('ArrowLeft');if(p(15))fire('ArrowRight');if(p(12))fire('ArrowUp');if(p(13))fire('ArrowDown');
      if(p(0)||p(9))fire('Enter');if(p(1))fire('Escape');
      const x=g.axes[0]||0,d=x>.6?1:x<-.6?-1:0;if(d&&d!==ax)fire(d>0?'ArrowRight':'ArrowLeft');ax=d}
    requestAnimationFrame(tick)}
  addEventListener('gamepadconnected',()=>{if(!tick.on){tick.on=1;tick()}});})();
function show(id){$$('.screen').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0)}
function stopGame(){if(cur){cur.alive=false;cur.timers.forEach(clearTimeout);cancelAnimationFrame(cur.raf)}keyFn=null;$$('.over').forEach(o=>o.remove());try{speechSynthesis.cancel()}catch(e){}}
function dots(){$('#dots').innerHTML=Array.from({length:5},(_,k)=>`<i class="${k<cur.score?'on':''}">${k<cur.score?'⭐':''}</i>`).join('')}
function runGame(id,lvl){
  stopGame();ac();
  const g=GAMES[id],me={id,lvl,score:0,miss:0,alive:true,timers:[],raf:0};cur=me;
  $('#ptitle').textContent=`${g.name} · Nivel ${lvl}`;dots();
  const stage=$('#stage');stage.innerHTML='';stage.className='stage gut g-'+id;show('play');
  const ok=()=>cur===me&&me.alive;
  const api={stage,lvl,finishMsg:null,
    after(ms,f){me.timers.push(setTimeout(()=>{if(ok())f()},ms))},
    loop(fn){let last=performance.now();const tick=t=>{if(!ok())return;fn(Math.min(.05,(t-last)/1000));last=t;me.raf=requestAnimationFrame(tick)};me.raf=requestAnimationFrame(tick)},
    key(f){keyFn=e=>{if(e.key==='Escape'){goMenu();return}f(e)}},
    miss(){me.miss++;sfx.bad()},
    point(delay=1200){me.score++;dots();if(me.score>=5){api.after(delay,()=>finish(me,api));return true}return false}
  };
  g.play(api);
}
function finish(me,api){
  me.alive=false;keyFn=null;
  const stars=api.finishMsg?3:me.miss<=1?3:me.miss<=4?2:1,key=me.id+'-'+me.lvl;
  P.stars[key]=Math.max(P.stars[key]||0,stars);save();
  const m=api.finishMsg?api.finishMsg():{t:['¡Muy bien!','¡Genial!','¡Fenomenal!'][stars-1],p:stars===3?'¡Sin casi fallos, campeones!':'Cada vez os sale mejor.'};
  const o=document.createElement('div');o.className='over';
  o.innerHTML=`<div class="ocard"><div class="bigstars">${[1,2,3].map(k=>`<span class="${k<=stars?'':'off'}">⭐</span>`).join('')}</div><h3>${m.t}</h3><p>${m.p}</p>
  ${me.lvl<3?`<button class="btn obtn" data-a="next" style="background:var(--mint)">Siguiente nivel ▶</button>`:''}
  <button class="btn obtn" data-a="again" style="background:var(--sky2)">Jugar otra vez</button>
  <button class="btn obtn" data-a="menu" style="background:var(--grape)">Elegir otro juego</button></div>`;
  document.body.appendChild(o);sfx.win();confetti();say(m.t);
  o.onclick=e=>{const a=e.target.closest('[data-a]');if(!a)return;o.remove();if(a.dataset.a==='next')runGame(me.id,me.lvl+1);else if(a.dataset.a==='again')runGame(me.id,me.lvl);else goMenu()}
}

/* ---------- Pantallas ---------- */
function goMenu(){stopGame();renderMenu();show('menu')}
function renderMenu(){
  $('#grid').innerHTML=Object.entries(GAMES).map(([id,g])=>{const s=[1,2,3].reduce((a,l)=>a+(P.stars[id+'-'+l]||0),0);
    return `<button class="gcard" data-g="${id}" style="--c:${g.c}"><span class="gi">${g.icon}</span><span class="gn">${g.name}</span><span class="gd">${g.desc}</span><span class="gs">⭐ ${s} / 9</span></button>`}).join('');
  $$('.gcard').forEach(b=>b.onclick=()=>{ac();openLevels(b.dataset.g)});
  $('#case').textContent=P.lower?'abc':'ABC';document.body.classList.toggle('lower',P.lower);
  $('#snd').textContent=P.mute?'🔇':'🔊';
  $('#unlock').textContent=P.all?'Para papás: volver a bloquear niveles':'Para papás: desbloquear todos los niveles';
  $('#zbtn').textContent=`🦁 Mi zoo (${P.zoo.length})`;
}
function openLevels(id){const g=GAMES[id];$('#lvt').textContent=g.name;$('#lvi').textContent=g.icon;
  $('#lvl').innerHTML=[1,2,3].map(l=>{const op=unlocked(id,l),s=P.stars[id+'-'+l]||0;
    return `<button class="btn lvb${op?'':' lock'}" data-l="${l}" style="--c:${g.c}"><span class="n">${op?l:'🔒'}</span><span class="t"><b>Nivel ${l}</b><small>${g.lv[l-1]}</small></span><span class="st">${op?'★'.repeat(s)+'☆'.repeat(3-s):''}</span></button>`}).join('');
  $$('.lvb').forEach(b=>b.onclick=()=>{const l=+b.dataset.l;if(!unlocked(id,l)){reshake(b);sfx.bad();say('primero termina el nivel '+(l-1));return}runGame(id,l)});
  show('lv')}
function renderZoo(){const list=P.zoo.map(byW).filter(Boolean);
  $('#zwrap').innerHTML=list.length?`<p class="hint">Toca un animal para oír su nombre</p><div class="zgrid">${list.map(a=>`<button class="btn zcell" data-w="${a.w}"><span>${a.e}</span><b class="wd">${a.w}</b></button>`).join('')}</div>`:`<div class="empty">Todavía no hay animales en tu zoo. Juega al Zoo mágico para traerlos.</div>`;
  $$('.zcell').forEach(b=>b.onclick=()=>{say(b.dataset.w);b.classList.remove('shake');void b.offsetWidth;b.querySelector('span').style.animation='jump .7s';setTimeout(()=>b.querySelector('span').style.animation='',700)});show('zoov')}

$('#logo').innerHTML='Lectolandia'.split('').map((c,i)=>`<span style="--c:${['var(--tomato)','var(--sun)','var(--mint)','var(--grape)','var(--pink)','var(--orange)'][i%6]};--dl:${i*.12}s">${c}</span>`).join('');
$$('[data-to="menu"]').forEach(b=>b.onclick=goMenu);
$('#quit').onclick=goMenu;
$('#case').onclick=()=>{P.lower=!P.lower;save();renderMenu()};
$('#snd').onclick=()=>{P.mute=!P.mute;save();renderMenu();if(!P.mute){ac();sfx.good()}};
$('#unlock').onclick=()=>{P.all=!P.all;save();renderMenu()};
$('#zbtn').onclick=renderZoo;
renderMenu();
$('#logo2').innerHTML=$('#logo').innerHTML;
// Presentación: primero "SantiSystems Games presenta", luego el título. Tocar también activa el sonido y la voz.
(function(){const it=$('#intro');let two=false,gone=false;
  const toTwo=()=>{if(two||gone)return;two=true;it.classList.add('two')};
  const start=()=>{if(gone)return;gone=true;ac();try{const u=new SpeechSynthesisUtterance('');speechSynthesis.speak(u)}catch(e){}it.style.opacity=0;setTimeout(()=>it.remove(),400);window.__lectoIntro=null;sfx.good()};
  setTimeout(toTwo,2200);
  it.addEventListener('click',()=>{if(!two)toTwo();else start()});
  window.__lectoIntro=e=>{if(gone)return false;e.preventDefault();if(!two)toTwo();else if(e.key==='Enter'||e.key===' ')start();return true};
  if(/[?&]sinintro/.test(location.search))start();})();
// En la web de SantiSystems: instalar como app, salir del juego y funcionar sin conexión
(function(){const web=location.pathname.indexOf('/juegos/lectolandia')>=0;if(!web)return;document.body.classList.add('web');
  let dp=null;const ib=$('#ssInstall'),ios=/iphone|ipad|ipod/i.test(navigator.userAgent),standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  if(!standalone&&ios)ib.hidden=false;
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;ib.hidden=false});
  addEventListener('appinstalled',()=>{dp=null;ib.hidden=true});
  ib.onclick=()=>{if(dp){dp.prompt();dp.userChoice.then(()=>{dp=null;ib.hidden=true})}else{const o=document.createElement('div');o.className='over';o.innerHTML='<div class="ocard"><div class="bigstars">📲</div><h3>Instalar</h3><p>En el iPhone o iPad: pulsa el botón Compartir de Safari y elige «Añadir a pantalla de inicio».</p><button class="btn obtn" style="background:var(--sky2)">Entendido</button></div>';o.querySelector('button').onclick=()=>o.remove();document.body.appendChild(o)}};
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});})();
</script>


<!-- SantiSystems · Salir del juego -->
<style>#ssExit{display:flex}#ssExit[hidden]{display:none!important}</style>
<div id="ssExit" hidden style="position:fixed;inset:0;z-index:2147483001;background:#0b0718;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#f7efe6;text-align:center">
  <div style="display:flex;align-items:center;gap:12px"><div style="width:48px;height:48px;border-radius:11px;background:linear-gradient(135deg,#ffb13b,#ff6a3d);display:grid;place-items:center;font:800 italic 27px/1 system-ui,sans-serif;color:#1b1030">S</div><div style="font:800 28px/1 system-ui,sans-serif;text-align:left">SantiSystems<small style="display:block;font:700 11px/1.6 system-ui,sans-serif;letter-spacing:.4em;color:#ffb13b">GAMES</small></div></div>
  <div id="ssExitH" style="font:800 italic 32px/1.1 system-ui,sans-serif;text-transform:uppercase"></div>
  <p id="ssExitTxt" style="margin:0;max-width:40ch;font-size:15px;line-height:1.5;color:#b6a6c8"></p>
  <button type="button" id="ssExitClose" style="padding:12px 28px;border:0;border-radius:12px;background:#ffb13b;color:#1b1030;font-weight:800;font-size:16px;cursor:pointer"></button>
  <button type="button" id="ssExitStay" style="padding:8px 14px;border:0;background:none;color:#b6a6c8;font-size:14px;text-decoration:underline;cursor:pointer"></button>
</div>
<script>
(function(){
  var ov=document.getElementById('ssExit'),$=function(i){return document.getElementById(i)};
  var mm=function(q){return window.matchMedia&&matchMedia(q).matches};
  var app=mm('(display-mode: standalone)')||mm('(display-mode: fullscreen)')||navigator.standalone,touch=mm('(pointer:coarse)');
  function en(){var l=null;try{l=localStorage.getItem('ssg.lang')}catch(e){}if(!l)l=(navigator.language||'es').toLowerCase().indexOf('es')===0?'es':'en';return l==='en'}
  function tryClose(){try{if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen()}catch(_){}
    try{window.close()}catch(_){}try{window.open('','_self');window.close()}catch(_){}}
  function textos(){var E=en();
    $('ssExitH').textContent=E?'Game closed':'Juego cerrado';$('ssExitClose').textContent=E?'Close':'Cerrar';$('ssExitStay').textContent=E?'Play again':'Volver a jugar';
    $('ssExitTxt').textContent=E?(app?(touch?'Thanks for playing. To remove it from the screen, open your recent apps and swipe it away.':'Thanks for playing. You can close this window now.'):(touch?'Thanks for playing. You can close this browser tab now.':'Thanks for playing. You can close this tab now (Ctrl+W).'))
      :(app?(touch?'Gracias por jugar. Para quitarlo de la pantalla, abre las apps recientes y deslízalo hacia arriba.':'Gracias por jugar. Ya puedes cerrar esta ventana.'):(touch?'Gracias por jugar. Ya puedes cerrar esta pestaña del navegador.':'Gracias por jugar. Ya puedes cerrar esta pestaña (Ctrl+W).'));}
  // Salir: se intenta cerrar la ventana; si el navegador no deja, el juego se queda cerrado (parado y sin sonido)
  function salir(){if(window.__rebufoSleep)window.__rebufoSleep(true);if(window.__ssDoze)window.__ssDoze();tryClose();
    setTimeout(function(){if(window.closed)return;textos();ov.hidden=false;$('ssExitClose').focus()},250)}
  function volver(){ov.hidden=true;if(window.__ssWake)window.__ssWake();if(window.__rebufoSleep)window.__rebufoSleep(false)}
  window.SSExit={salir:salir};
  var b=$('ssExitBtn');if(b)b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();
    if(window.__rebufoUnsaved&&window.__rebufoUnsaved()&&window.__rebufoAskSave){window.__rebufoAskSave(salir);return}salir()});
  $('ssExitClose').addEventListener('click',function(e){e.stopPropagation();tryClose();setTimeout(function(){if(!window.closed&&!app&&history.length>1)history.back()},250)});
  $('ssExitStay').addEventListener('click',function(e){e.stopPropagation();volver()});
  ['keydown','keyup','pointerdown','touchstart'].forEach(function(t){addEventListener(t,function(e){if(ov.hidden)return;if(e.target&&ov.contains(e.target))return;e.stopPropagation();if(t==='keydown'&&e.key==='Escape')volver()},true)});
})();
</script>
